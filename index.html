<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MP체크리스트">
<meta name="theme-color" content="#1a1a2e">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>MPLAYGROUND 체크리스트</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#1a1a2e;--accent:#D85A30;--accent2:#185FA5;
  --ok:#1D9E75;--warn:#BA7517;--danger:#A32D2D;
  --bg:#f4f4f0;--card:#fff;--text:#1a1a2e;--text2:#666;
  --border:#e4e4e0;--inp-bg:#f8f8f5;
  --shadow:0 2px 10px rgba(0,0,0,0.07);
}
@media(prefers-color-scheme:dark){
  :root{--bg:#111113;--card:#1c1c1e;--text:#f0f0f0;--text2:#8e8e93;--border:#2c2c2e;--inp-bg:#2c2c2e;--shadow:0 2px 10px rgba(0,0,0,0.3);}
}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);font-size:14px}
#root{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
.screen{display:none;flex-direction:column;height:100%;overflow:hidden}
.screen.active{display:flex}

/* LOGIN */
#s-login{align-items:center;justify-content:center;background:linear-gradient(160deg,#1a1a2e,#0f3460)}
.login-box{width:100%;max-width:340px;padding:24px 20px}
.login-logo{color:#fff;font-size:22px;font-weight:700;letter-spacing:3px;margin-bottom:4px}
.login-sub{color:rgba(255,255,255,0.45);font-size:12px;margin-bottom:30px}
.login-card{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:18px;padding:26px 22px;backdrop-filter:blur(12px)}
.login-card h2{color:#fff;font-size:15px;font-weight:600;margin-bottom:20px}
.fg{margin-bottom:14px}
.fg label{display:block;color:rgba(255,255,255,0.6);font-size:12px;margin-bottom:5px}
.fg input{width:100%;padding:11px 14px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:10px;color:#fff;font-size:14px;font-family:inherit;outline:none}
.fg input:focus{border-color:var(--accent)}
.fg input::placeholder{color:rgba(255,255,255,0.3)}
.btn-login{width:100%;padding:13px;background:var(--accent);border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:4px}
.login-err{color:#ff6b6b;font-size:12px;text-align:center;margin-top:10px;display:none}
.install-hint{margin-top:16px;color:rgba(255,255,255,0.4);font-size:11px;text-align:center;line-height:1.7;background:rgba(255,255,255,0.04);border-radius:10px;padding:12px}

/* SYNC OVERLAY */
#sync-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px}
#sync-overlay.show{display:flex}
.sync-spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sync-msg{color:#fff;font-size:14px}

/* HEADER */
.hdr{background:var(--primary);color:#fff;padding-top:env(safe-area-inset-top,0);flex-shrink:0}
.hdr-inner{padding:12px 14px;display:flex;align-items:center;gap:10px}
.hdr-back{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;padding:4px;line-height:1}
.hdr-title{flex:1}
.hdr-title .t1{font-size:16px;font-weight:700}
.hdr-title .t2{font-size:11px;color:rgba(255,255,255,0.5)}
.hdr-btn{background:rgba(255,255,255,0.12);border:none;color:#fff;border-radius:8px;padding:6px 11px;font-size:12px;cursor:pointer;font-family:inherit}
.sync-badge{font-size:11px;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.7);white-space:nowrap}
.sync-badge.saving{background:rgba(255,200,0,0.25);color:#ffe066}
.sync-badge.saved{background:rgba(46,204,113,0.25);color:#7effc0}
.sync-badge.err{background:rgba(231,76,60,0.3);color:#ff8b8b}

/* HOME */
#s-home{background:var(--bg)}
.home-hdr{background:var(--primary);padding-top:env(safe-area-inset-top,0);flex-shrink:0}
.home-hdr-inner{padding:14px 14px 0}
.home-logo{color:#fff;font-size:18px;font-weight:700;letter-spacing:1px}
.home-hdr-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.home-tabs{display:flex;gap:5px;padding:0 14px 12px;overflow-x:auto}
.home-tabs::-webkit-scrollbar{display:none}
.htab{padding:7px 13px;border:1px solid rgba(255,255,255,0.15);border-radius:8px;background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.7);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0}
.htab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.home-body{flex:1;overflow-y:auto;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0))}

/* STORE GRID */
.store-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.store-tile{background:var(--card);border-radius:14px;padding:14px 12px;box-shadow:var(--shadow);cursor:pointer;position:relative;overflow:hidden;border:1px solid var(--border);transition:opacity .15s}
.store-tile:active{opacity:0.7}
.tile-type{font-size:10px;color:var(--text2);margin-bottom:3px}
.tile-name{font-size:14px;font-weight:700;margin-bottom:1px}
.tile-code{font-size:11px;color:var(--text2)}
.tile-rate{position:absolute;top:10px;right:10px;font-size:13px;font-weight:700;color:var(--accent)}
.tile-sub{position:absolute;bottom:8px;right:8px;font-size:10px;color:var(--ok);font-weight:600}

/* DATE BAR */
.date-bar{background:var(--card);padding:9px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);flex-shrink:0}
.date-bar label{font-size:12px;color:var(--text2)}
.date-bar input[type=date]{border:1px solid var(--border);border-radius:9px;padding:6px 9px;font-size:13px;font-family:inherit;background:var(--inp-bg);color:var(--text);outline:none;flex:1}
.prog-pill{background:var(--primary);color:#fff;border-radius:20px;padding:4px 11px;font-size:12px;font-weight:700;white-space:nowrap}

/* TAB BAR */
.tab-bar{background:var(--card);display:flex;overflow-x:auto;border-bottom:1px solid var(--border);flex-shrink:0}
.tab-bar::-webkit-scrollbar{display:none}
.tb{flex:0 0 auto;padding:11px 14px;border:none;background:none;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;font-family:inherit;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tb.active{color:var(--accent);border-bottom-color:var(--accent)}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding:12px 12px 90px;-webkit-overflow-scrolling:touch}

/* SEC CARD */
.sec-card{background:var(--card);border-radius:14px;margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border)}
.sec-hdr{padding:12px 14px;display:flex;align-items:center;gap:8px;cursor:pointer;background:var(--primary)}
.sec-title{flex:1;font-size:13px;font-weight:600;color:#fff}
.sec-cnt{font-size:11px;color:rgba(255,255,255,0.55);background:rgba(255,255,255,0.1);border-radius:10px;padding:2px 8px}
.sec-arr{font-size:11px;color:rgba(255,255,255,0.5);transition:transform .2s}
.sec-arr.open{transform:rotate(180deg)}
.sec-body{display:none}
.sec-body.open{display:block}

/* CHECK ITEM */
.ci{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px}
.ci.expired{background:#fff5f5}
@media(prefers-color-scheme:dark){.ci.expired{background:#2a1515}}
.deadline-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;white-space:nowrap;margin-top:3px}
.deadline-badge.ok{background:#e8f5e9;color:#2e7d32}
.deadline-badge.warn{background:#fff3e0;color:#e65100}
.deadline-badge.over{background:#ffebee;color:#c62828}
.deadline-badge.none{background:var(--inp-bg);color:var(--text2)}
.sort-bar{background:var(--card);border-bottom:1px solid var(--border);padding:8px 14px;display:flex;align-items:center;gap:6px;flex-shrink:0;overflow-x:auto}
.sort-bar::-webkit-scrollbar{display:none}
.sort-btn{border:1px solid var(--border);background:var(--inp-bg);border-radius:20px;padding:4px 12px;font-size:12px;cursor:pointer;font-family:inherit;color:var(--text2);white-space:nowrap;transition:all .15s}
.sort-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.time-input{border:1px solid var(--border);border-radius:6px;padding:3px 6px;font-size:11px;width:72px;font-family:inherit;background:var(--inp-bg);color:var(--text);outline:none}
.ci:last-child{border-bottom:none}
.ci-num{font-size:11px;color:var(--text2);min-width:16px;padding-top:2px}
.ci-info{flex:1}
.ci-area{font-size:10px;color:var(--text2);margin-bottom:1px}
.ci-name{font-size:13px;line-height:1.4}
.ci-desc{font-size:11px;color:var(--text2);margin-top:2px;line-height:1.5;word-break:keep-all}
.ci-desc-toggle{font-size:10px;color:var(--accent2);cursor:pointer;text-decoration:underline;margin-top:2px;display:inline-block}
.ci-controls{display:flex;flex-direction:column;gap:5px;align-items:flex-end;min-width:94px}
.status-btns{display:flex;gap:3px}
.sbtn{border:1px solid var(--border);background:var(--inp-bg);border-radius:7px;padding:5px 7px;font-size:12px;cursor:pointer;font-weight:600;font-family:inherit;color:var(--text2)}
.sbtn.done{background:#d4edda;border-color:#28a745;color:#155724}
.sbtn.fail{background:#f8d7da;border-color:#dc3545;color:#721c24}
.sbtn.na{background:var(--border);color:var(--text2)}
.staff-sel{border:1px solid var(--border);border-radius:7px;padding:4px 5px;font-size:11px;width:94px;font-family:inherit;background:var(--inp-bg);color:var(--text);outline:none}

/* FAC */
.fac-item{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start}
.fac-item:last-child{border-bottom:none}
.fac-main{flex:1}
.fac-area{font-size:10px;color:var(--text2)}
.fac-name{font-size:13px;margin:2px 0 5px}
.fac-inp{width:100%;border:1px solid var(--border);border-radius:7px;padding:5px 8px;font-size:12px;background:var(--inp-bg);color:var(--text);font-family:inherit;outline:none;margin-bottom:4px}
.fac-done-btn{border:1px solid var(--border);background:var(--inp-bg);border-radius:7px;padding:6px 10px;font-size:11px;cursor:pointer;font-family:inherit;color:var(--text2);white-space:nowrap;min-width:52px;text-align:center}
.fac-done-btn.done{background:#d4edda;border-color:#28a745;color:#155724}

/* REPAIR */
.rr{padding:11px 14px;border-bottom:1px solid var(--border)}
.rr:last-child{border-bottom:none}
.rr-num{font-size:11px;color:var(--text2);margin-bottom:5px}
.rr-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.r-inp,.r-sel,.r-ta{border:1px solid var(--border);border-radius:7px;padding:7px 9px;font-size:12px;background:var(--inp-bg);color:var(--text);font-family:inherit;outline:none;width:100%}
.r-ta{resize:none;height:46px;grid-column:1/-1}

/* MEMO */
.memo-card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);border:1px solid var(--border)}
.memo-card h3{font-size:13px;font-weight:600;margin-bottom:8px;color:var(--primary)}
@media(prefers-color-scheme:dark){.memo-card h3{color:#f0f0f0}}
.memo-ta{width:100%;border:1px solid var(--border);border-radius:7px;padding:8px;font-size:13px;font-family:inherit;color:var(--text);background:var(--inp-bg);outline:none;resize:none}

/* SUBMIT BAR */
.submit-bar{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--border);padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0));display:flex;gap:8px;box-shadow:0 -3px 15px rgba(0,0,0,0.06)}
.btn-save{padding:12px 16px;background:none;border:1px solid var(--border);border-radius:11px;color:var(--text2);font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-submit{flex:1;padding:12px;background:var(--accent);border:none;border-radius:11px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-unlock{padding:12px 14px;background:none;border:1px solid var(--border);border-radius:11px;color:var(--warn);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}

/* ADMIN */
.admin-store-sel{width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-size:13px;font-family:inherit;background:var(--inp-bg);color:var(--text);outline:none;margin-bottom:14px}
.adm-sec{margin-bottom:16px}
.adm-sec-title{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:8px;letter-spacing:.5px;text-transform:uppercase}
.adm-card{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:8px}
.adm-collapse-hdr{padding:12px 14px;display:flex;align-items:center;gap:8px;cursor:pointer;background:var(--inp-bg);border-bottom:1px solid var(--border);user-select:none}
.adm-collapse-title{flex:1;font-size:13px;font-weight:600}
.adm-collapse-cnt{font-size:11px;color:var(--text2);background:var(--card);border-radius:10px;padding:2px 8px;border:1px solid var(--border)}
.adm-collapse-arr{font-size:12px;color:var(--text2);transition:transform .2s;flex-shrink:0}
.adm-collapse-arr.open{transform:rotate(180deg)}
.adm-collapse-body{display:none}
.adm-collapse-body.open{display:block}
.adm-item{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;transition:background .15s}
.adm-item:last-child{border-bottom:none}
.adm-item.dragging{opacity:.35;background:var(--inp-bg)}
.adm-item.drag-over{border-top:2px solid var(--accent2);margin-top:-1px}
.drag-handle{color:var(--text2);font-size:18px;cursor:grab;padding:2px 2px;touch-action:none;flex-shrink:0;line-height:1;opacity:.5}
.drag-handle:active{cursor:grabbing;opacity:1}
.adm-item-info{flex:1;min-width:0}
.adm-item-area{font-size:10px;color:var(--text2);margin-bottom:1px}
.adm-item-name{font-size:13px;line-height:1.4;word-break:keep-all}
.adm-btns{display:flex;gap:3px;flex-shrink:0}
.btn-del{background:#fff0f0;border:1px solid #fcc;color:var(--danger);border-radius:7px;padding:4px 7px;font-size:11px;cursor:pointer;font-family:inherit}
.btn-hide{background:#f5f5f5;border:1px solid #ddd;color:#888;border-radius:7px;padding:4px 7px;font-size:11px;cursor:pointer;font-family:inherit}
.btn-show{background:#fff8e1;border:1px solid #ffd54f;color:#f57f17;border-radius:7px;padding:4px 7px;font-size:11px;cursor:pointer;font-family:inherit}
@media(prefers-color-scheme:dark){
  .btn-hide{background:#2a2a2a;border-color:#444;color:#888}
  .btn-show{background:#2a2200;border-color:#7a5c00;color:#ffc107}
}
.adm-item.hidden-item{opacity:0.45;background:repeating-linear-gradient(45deg,transparent,transparent 6px,rgba(0,0,0,0.03) 6px,rgba(0,0,0,0.03) 12px)}
.hidden-badge{font-size:10px;padding:1px 6px;border-radius:10px;background:#f5f5f5;color:#888;border:1px solid #ddd;margin-left:5px;vertical-align:middle}
.hidden-section{margin-bottom:10px}
.hidden-toggle-btn{width:100%;padding:9px 14px;background:var(--card);border:1px solid var(--border);border-radius:12px;font-size:12px;color:var(--text2);cursor:pointer;font-family:inherit;text-align:left;display:flex;align-items:center;gap:6px}
.btn-edit-item{background:#eef4ff;border:1px solid #c0d4f8;color:var(--accent2);border-radius:7px;padding:4px 7px;font-size:11px;cursor:pointer;font-family:inherit}
@media(prefers-color-scheme:dark){
  .btn-del{background:#3a1515;border-color:#5a2020}
  .btn-edit-item{background:#1a2535;border-color:#2a4a7f}
}
.edit-inline-row{padding:8px 12px;display:flex;gap:5px;background:#eef6ff;border-bottom:1px solid var(--border)}
@media(prefers-color-scheme:dark){.edit-inline-row{background:#182030}}
.edit-inline-row input{flex:1;border:1px solid var(--border);border-radius:7px;padding:6px 8px;font-size:12px;font-family:inherit;background:var(--card);color:var(--text);outline:none}
.btn-save-edit{background:var(--ok);border:none;color:#fff;border-radius:7px;padding:6px 10px;font-size:11px;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-cancel-edit{background:none;border:1px solid var(--border);color:var(--text2);border-radius:7px;padding:6px 7px;font-size:11px;cursor:pointer;font-family:inherit}
.add-row{padding:10px 12px;display:flex;gap:6px;background:var(--inp-bg);border-top:1px solid var(--border)}
.add-row input,.add-row select{flex:1;border:1px solid var(--border);border-radius:7px;padding:7px 9px;font-size:13px;font-family:inherit;background:var(--card);color:var(--text);outline:none}
.btn-add{background:var(--accent2);border:none;color:#fff;border-radius:7px;padding:7px 13px;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap}

/* REPORT */
.rpt-filter{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--border)}
.rpt-filter-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rpt-filter label{font-size:12px;color:var(--text2)}
.rpt-filter input[type=date],.rpt-filter select{border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:13px;font-family:inherit;background:var(--inp-bg);color:var(--text);outline:none;flex:1;min-width:110px}
.rpt-card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:8px;box-shadow:var(--shadow);border:1px solid var(--border)}
.rpt-card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.rpt-store{font-size:14px;font-weight:700}
.rpt-rate{font-size:20px;font-weight:700}
.rpt-bar-wrap{background:var(--inp-bg);border-radius:10px;height:7px;overflow:hidden;margin-bottom:6px}
.rpt-bar{height:100%;border-radius:10px;transition:width .4s}
.rpt-meta{font-size:11px;color:var(--text2);display:flex;gap:10px}
.badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600}
.badge-ok{background:#d4edda;color:#155724}
.badge-warn{background:#fff3cd;color:#856404}
.badge-no{background:var(--border);color:var(--text2)}
.summary-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sum-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.sum-val{font-size:24px;font-weight:700;margin-bottom:2px}
.sum-lbl{font-size:11px;color:var(--text2)}
.stores-filter{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.stores-filter-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stores-filter label{font-size:12px;color:var(--text2);white-space:nowrap}
.stores-filter input[type=date]{border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:13px;font-family:inherit;background:var(--inp-bg);color:var(--text);outline:none;flex:1;min-width:130px}
.stores-filter select{border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:13px;font-family:inherit;background:var(--inp-bg);color:var(--text);outline:none;flex:1;min-width:100px}
.stores-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stores-sum-card{background:var(--card);border-radius:12px;padding:12px 14px;border:1px solid var(--border);box-shadow:var(--shadow);text-align:center}
.stores-sum-val{font-size:22px;font-weight:700;margin-bottom:2px}
.stores-sum-lbl{font-size:11px;color:var(--text2)}
.store-tile.has-data{border-color:var(--ok);border-width:1.5px}
.store-tile.submitted-tile{border-color:var(--ok);background:linear-gradient(135deg,var(--card),#f0faf5)}
@media(prefers-color-scheme:dark){.store-tile.submitted-tile{background:linear-gradient(135deg,var(--card),#0d2318)}}
.tile-progress{height:3px;background:var(--border);border-radius:10px;margin-top:6px;overflow:hidden}
.tile-progress-bar{height:100%;border-radius:10px;transition:width .4s}
.empty-msg{text-align:center;padding:30px 0;color:var(--text2);font-size:13px}
/* 마감보고 */
.closing-section{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);border:1px solid var(--border)}
.closing-section h3{font-size:13px;font-weight:600;margin-bottom:10px;color:var(--primary);display:flex;align-items:center;gap:6px}
@media(prefers-color-scheme:dark){.closing-section h3{color:#f0f0f0}}
.closing-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.closing-label{font-size:12px;color:var(--text2);min-width:60px}
.closing-val{font-size:14px;font-weight:700;color:var(--accent)}
.closing-inp{flex:1;border:1px solid var(--border);border-radius:7px;padding:7px 9px;font-size:13px;font-family:inherit;background:var(--inp-bg);color:var(--text);outline:none}
.closing-ta{width:100%;border:1px solid var(--border);border-radius:7px;padding:8px;font-size:13px;font-family:inherit;color:var(--text);background:var(--inp-bg);outline:none;resize:none}
.achieve-bar-wrap{background:var(--inp-bg);border-radius:10px;height:8px;overflow:hidden;margin:6px 0}
.achieve-bar{height:100%;border-radius:10px;transition:width .4s}
.photo-upload-area{border:2px dashed var(--border);border-radius:10px;padding:20px;text-align:center;cursor:pointer;color:var(--text2);font-size:13px;margin-bottom:8px;transition:border-color .2s}
.photo-upload-area:hover{border-color:var(--accent2)}
.photo-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px}
.photo-thumb{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:1}
.photo-thumb img{width:100%;height:100%;object-fit:cover}
.photo-thumb-del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,0.6);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
/* 권한 배지 */
.perm-badge{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600;white-space:nowrap}
.perm-manager{background:#e8f4fd;color:#1a6fa8}
.perm-master{background:#f3e8fd;color:#6a1ab8}
@media(prefers-color-scheme:dark){.perm-manager{background:#1a3a50;color:#7ec8f5}.perm-master{background:#2e1a50;color:#c87ef5}}
/* 피드백 */
.feedback-card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;border:2px solid var(--accent2);box-shadow:var(--shadow)}
.feedback-header{font-size:13px;font-weight:600;color:var(--accent2);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.feedback-meta{font-size:11px;color:var(--text2);margin-top:8px}
/* 계정관리 */
.acct-card{background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--border);margin-bottom:8px;box-shadow:var(--shadow)}
.acct-item{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.acct-item:last-child{border-bottom:none}
.acct-info{flex:1}
.acct-id{font-size:13px;font-weight:600}
.acct-pw{font-size:11px;color:var(--text2);margin-top:1px}
.acct-type{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600}
.acct-staff{background:#e8f5e9;color:#2e7d32}
.acct-manager{background:#e8f4fd;color:#1a6fa8}
.acct-master{background:#f3e8fd;color:#6a1ab8}
@media(prefers-color-scheme:dark){.acct-staff{background:#1a3020}.acct-manager{background:#1a3a50}.acct-master{background:#2e1a50}}

/* TOAST */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:9px 20px;border-radius:20px;font-size:13px;z-index:9999;opacity:0;transition:opacity .25s;white-space:nowrap;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,0.2)}
.toast.show{opacity:1}
/* 확인 모달 */
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:8000;display:flex;align-items:center;justify-content:center;padding:20px}
.confirm-box{background:var(--card);border-radius:16px;padding:24px 20px;width:100%;max-width:320px;box-shadow:0 8px 32px rgba(0,0,0,0.2)}
.confirm-icon{font-size:28px;text-align:center;margin-bottom:10px}
.confirm-title{font-size:15px;font-weight:700;text-align:center;margin-bottom:6px}
.confirm-msg{font-size:13px;color:var(--text2);text-align:center;line-height:1.6;margin-bottom:20px;word-break:keep-all}
.confirm-btns{display:flex;gap:8px}
.confirm-btn-cancel{flex:1;padding:11px;border:1px solid var(--border);border-radius:10px;background:none;color:var(--text2);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
.confirm-btn-ok{flex:1;padding:11px;border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.confirm-btn-ok.danger{background:var(--danger)}
.confirm-btn-ok.primary{background:var(--accent2)}
/* 대분류 헤더 */
.sec-manage-hdr{display:flex;align-items:center;gap:6px;flex:1}
.sec-manage-btns{display:flex;gap:4px;flex-shrink:0}
.btn-sec-edit{background:#eef4ff;border:1px solid #c0d4f8;color:var(--accent2);border-radius:7px;padding:3px 8px;font-size:11px;cursor:pointer;font-family:inherit}
.btn-sec-del{background:#fff0f0;border:1px solid #fcc;color:var(--danger);border-radius:7px;padding:3px 8px;font-size:11px;cursor:pointer;font-family:inherit}
@media(prefers-color-scheme:dark){.btn-sec-edit{background:#1a2535;border-color:#2a4a7f}.btn-sec-del{background:#3a1515;border-color:#5a2020}}
.sec-edit-row{padding:10px 14px;background:#eef6ff;border-bottom:1px solid var(--border);display:none}
@media(prefers-color-scheme:dark){.sec-edit-row{background:#182030}}
.sec-edit-row input{width:100%;border:1px solid var(--border);border-radius:7px;padding:7px 9px;font-size:13px;font-family:inherit;background:var(--card);color:var(--text);outline:none;margin-bottom:6px}
.sec-edit-row-btns{display:flex;gap:6px}
/* 대분류 추가 */
.add-sec-row{padding:12px 14px;background:var(--inp-bg);border:1px solid var(--border);border-radius:12px;margin-bottom:8px}
.btn-all-stores{background:linear-gradient(135deg,#185FA5,#1D9E75);border:none;color:#fff;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.bulk-banner{background:linear-gradient(135deg,#1a1a2e,#185FA5);border-radius:12px;padding:14px;margin-bottom:12px;color:#fff}
.bulk-banner h3{font-size:14px;font-weight:700;margin-bottom:4px}
.bulk-banner p{font-size:11px;color:rgba(255,255,255,0.65);line-height:1.6}
.bulk-store-chips{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}
.bulk-chip{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid rgba(255,255,255,0.3);color:#fff;background:rgba(255,255,255,0.1);transition:all .15s}
.bulk-chip.selected{background:#fff;color:#1a1a2e;border-color:#fff}
.bulk-mode-card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid var(--border);box-shadow:var(--shadow)}
.bulk-mode-title{font-size:13px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.bulk-result{padding:10px 12px;border-radius:8px;font-size:12px;margin-top:8px;line-height:1.7}
.bulk-result.ok{background:#e8f5e9;color:#2e7d32}
.bulk-result.err{background:#ffebee;color:#c62828}
.bulk-item-list{border:1px solid var(--border);border-radius:8px;max-height:220px;overflow-y:auto;background:var(--card)}
.bulk-item-check{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.bulk-item-check:last-child{border-bottom:none}
.bulk-item-check:active{background:var(--inp-bg)}
.bulk-item-check input[type=checkbox]{width:16px;height:16px;cursor:pointer;accent-color:var(--accent2);flex-shrink:0}
.bulk-item-check label{font-size:13px;cursor:pointer;flex:1;line-height:1.4}
.bulk-item-check .item-time{font-size:11px;color:var(--text2);white-space:nowrap}
.bulk-check-all-row{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;background:var(--inp-bg);border-radius:8px;margin-bottom:4px}
.bulk-check-all-row span{font-size:12px;color:var(--text2)}
.add-sec-row label{font-size:11px;font-weight:700;color:var(--text2);display:block;margin-bottom:6px}
.add-sec-row input{width:100%;border:1px solid var(--border);border-radius:7px;padding:8px 10px;font-size:13px;font-family:inherit;background:var(--card);color:var(--text);outline:none;margin-bottom:6px}
</style>
</head>
<body>
<div id="root">

<!-- LOGIN -->
<div class="screen active" id="s-login">
  <div class="login-box">
    <div class="login-logo">MPLAYGROUND</div>
    <div class="login-sub">매장 업무 체크리스트</div>
    <div class="login-card">
      <h2>로그인</h2>
      <div class="fg"><label>아이디</label><input type="text" id="inp-id" placeholder="매장코드 또는 admin" autocomplete="off" inputmode="text"></div>
      <div class="fg"><label>비밀번호</label><input type="password" id="inp-pw" placeholder="비밀번호"></div>
      <button class="btn-login" onclick="doLogin()">로그인</button>
      <div class="login-err" id="login-err">아이디 또는 비밀번호가 올바르지 않습니다.</div>
    </div>
    <div class="install-hint">
      📱 홈화면에 추가하면 앱처럼 사용 가능해요<br>
      iPhone: 공유버튼(□↑) → 홈 화면에 추가<br>
      Android: 메뉴(⋮) → 홈 화면에 추가
    </div>
  </div>
</div>

<!-- HOME (admin) -->
<div class="screen" id="s-home">
  <div class="home-hdr">
    <div class="home-hdr-inner">
      <div class="home-hdr-row">
        <div class="home-logo">MPLAYGROUND</div>
        <button class="hdr-btn" onclick="doLogout()">로그아웃</button>
      </div>
    </div>
    <div class="home-tabs">
      <button class="htab active" id="ht-stores" onclick="switchHTab('stores')">매장 현황</button>
      <button class="htab" id="ht-staff" onclick="switchHTab('staff')">직원 관리</button>
      <button class="htab" id="ht-admin" onclick="switchHTab('admin')">체크리스트 관리</button>
      <button class="htab" id="ht-stores-manage" onclick="switchHTab('stores-manage')">매장 관리</button>
      <button class="htab" id="ht-accounts" onclick="switchHTab('accounts')">계정 관리</button>
      <button class="htab" id="ht-closing-report" onclick="switchHTab('closing-report')">마감보고 확인</button>
      <button class="htab" id="ht-report" onclick="switchHTab('report')">이행률 보고</button>
    </div>
  </div>
  <div class="home-body" id="home-body"></div>
</div>

<!-- APP (checklist) -->
<div class="screen" id="s-app">
  <div class="hdr">
    <div class="hdr-inner">
      <button class="hdr-back" id="btn-back" onclick="goBack()">←</button>
      <div class="hdr-title">
        <div class="t1" id="hdr-name"></div>
        <div class="t2" id="hdr-code"></div>
      </div>
      <span class="sync-badge saved" id="sync-badge">저장됨</span>
      <button class="hdr-btn" onclick="doLogout()">로그아웃</button>
    </div>
  </div>
  <div class="date-bar">
    <label>날짜</label>
    <input type="date" id="cur-date" onchange="onDateChange()">
    <div class="prog-pill" id="prog-pill">0%</div>
  </div>
  <div class="sort-bar" id="sort-bar" style="display:none">
    <span style="font-size:11px;color:var(--text2);white-space:nowrap">정렬:</span>
    <button class="sort-btn active" id="sort-default" onclick="setSort('default')">분류순</button>
    <button class="sort-btn" id="sort-asc" onclick="setSort('asc')">⏰ 마감 빠른순</button>
    <button class="sort-btn" id="sort-desc" onclick="setSort('desc')">⏰ 마감 느린순</button>
    <button class="sort-btn" id="sort-undone" onclick="setSort('undone')">❗미완료 우선</button>
  </div>
  <div class="tab-bar">
    <button class="tb active" onclick="switchTab(0)">📋 체크시트</button>
    <button class="tb" onclick="switchTab(1)">🔧 시설점검</button>
    <button class="tb" onclick="switchTab(2)">📩 보수요청</button>
    <button class="tb" id="tb-closing" onclick="switchTab(3)">🌙 마감보고</button>
    <button class="tb" onclick="switchTab(4)">📝 메모</button>
  </div>
  <div class="content" id="app-content"></div>
  <div class="submit-bar" id="submit-bar">
    <button class="btn-save" onclick="saveNow()">💾 저장</button>
    <button class="btn-submit" id="btn-submit" onclick="submitCurrent()">✅ 제출</button>
    <button class="btn-unlock" id="btn-unlock" onclick="unlockCurrent()" style="display:none">🔓 수정</button>
  </div>
</div>

</div>

<!-- Sync overlay -->
<div id="sync-overlay">
  <div class="sync-spinner"></div>
  <div class="sync-msg" id="sync-msg">데이터 불러오는 중...</div>
</div>

<div class="toast" id="toast"></div>

<!-- 확인 모달 -->
<div class="confirm-overlay" id="confirm-overlay" style="display:none">
  <div class="confirm-box">
    <div class="confirm-icon" id="confirm-icon">⚠️</div>
    <div class="confirm-title" id="confirm-title">확인</div>
    <div class="confirm-msg" id="confirm-msg"></div>
    <div class="confirm-btns">
      <button class="confirm-btn-cancel" onclick="window.confirmResolve(false)">취소</button>
      <button class="confirm-btn-ok danger" id="confirm-ok" onclick="window.confirmResolve(true)">확인</button>
    </div>
  </div>
</div>

<!-- Firebase SDK (인라인 번들) -->

// ── Firebase CRUD ──
async function fbGet(path){
  try{const snap=await db.ref(path).get();return snap.exists()?snap.val():null;}
  catch(e){console.warn('fbGet err',e);return null;}
}
async function fbSet(path,val){
  try{await db.ref(path).set(val);}
  catch(e){console.warn('fbSet err',e);throw e;}
}
function fbListen(path,cb){
  const r=db.ref(path);
  r.on('value',snap=>cb(snap.exists()?snap.val():null));
  return r;
}
function fbUnlisten(r){if(r)try{r.off();}catch{}}

function dayPath(sc,date){return `days/${sc}/${date.replace(/-/g,'')}`;}
function cfgPath(sc){return `configs/${sc}`;}
function staffPath(sc){return `staff/${sc}`;}

function chiefPath(sc){ return 'chiefs/'+sc; }

}
async function setChiefs(sc,list){
  await fbSet(chiefPath(sc), list.length?Object.fromEntries(list.map((n,i)=>[i,n])):null);
}

async function isChief(){
  if(isMaster())return true;

  const staffList=await getStaff(curStore.code);
  // manager 계정은 항상 간부
  if(isManager())return true;
  return false;
}

async function loadStores(){
  try{
    const data=await fbGet(storesPath());
    if(data&&Array.isArray(data)&&data.length>0){
      STORES=data;
    } else {
      // 최초 1회: 기본 매장 목록을 Firebase에 저장
      await fbSet(storesPath(), DEFAULT_STORES);
      STORES=[...DEFAULT_STORES];
    }
    rebuildActs();
  } catch(e){ console.warn('loadStores error',e); STORES=[...DEFAULT_STORES]; }
}

  await fbSet(storesPath(), list);
  STORES=list;

}

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function showOverlay(msg){document.getElementById('sync-msg').textContent=msg;document.getElementById('sync-overlay').classList.add('show');}
function hideOverlay(){document.getElementById('sync-overlay').classList.remove('show');}
function setSyncB(state,msg){const el=document.getElementById('sync-badge');if(!el)return;el.className='sync-badge '+state;el.textContent=msg;}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function todayStr(){return new Date().toISOString().slice(0,10);}
function curDate(){return document.getElementById('cur-date').value;}
function calcRate(cfg,data){const t=countTotal(cfg);if(!t)return 0;return Math.round(countDone(cfg,data)/t*100);}
function countTotal(cfg){return Object.values(cfg.checklist).reduce((s,items)=>s+items.length,0);}
function countDone(cfg,data){let d=0;for(const[sec,items]of Object.entries(cfg.checklist))items.forEach((_,i)=>{const v=(data.checks||{})[sec+':'+i];if(v==='done'||v==='na')d++;});return d;}
function toggleSec(h){const b=h.nextElementSibling;const a=h.querySelector('.sec-arr');b.classList.toggle('open');a.classList.toggle('open',b.classList.contains('open'));}

async function doLogin(){
  const id=document.getElementById('inp-id').value.trim();
  const pw=document.getElementById('inp-pw').value;
  // 매장 목록 먼저 로드 (최신 반영)
  showOverlay('로그인 중...');
  await loadStores();
  rebuildActs();          // 먼저 기본 계정 설정 (mng 포함)
  await loadCustomPasswords(); // 그 다음 Firebase 커스텀 PW로 덮어씀
  hideOverlay();
  if(ACCTS[id]&&ACCTS[id]===pw){
    document.getElementById('login-err').style.display='none';
    curUser=id;
    history.pushState({},'',location.href);
    if(id==='admin'){curStore=null;showHome();}
    else{
      // mng 계정이면 앞의 매장코드로 매장 찾기 (예: M0001-mng → M0001)
      const storeCode = id.endsWith('-mng') ? id.replace('-mng','') : id;
      curStore=STORES.find(s=>s.code===storeCode);
      if(!curStore){document.getElementById('login-err').style.display='block';return;}
      showApp();
    }
  } else {
    document.getElementById('login-err').style.display='block';
  }
}
function doLogout(){
  fbUnlisten(curListener);curListener=null;
  curUser=null;curStore=null;curTab=0;
  show('s-login');
  document.getElementById('inp-id').value='';
  document.getElementById('inp-pw').value='';
}

}

async function loadStoresByDate(){
  const dateEl=document.getElementById('stores-date');
  const typeEl=document.getElementById('stores-type-filter');
  if(!dateEl)return;
  const date=dateEl.value||todayStr();
  const typeFilter=typeEl?typeEl.value:'all';
  const summaryEl=document.getElementById('stores-summary');
  const gridEl=document.getElementById('stores-grid-wrap');
  if(summaryEl)summaryEl.innerHTML='<div class="stores-sum-card"><div class="stores-sum-val" style="font-size:14px;color:var(--text2)">불러오는 중...</div></div>';
  if(gridEl)gridEl.innerHTML='';

  const targets=typeFilter==='all'?STORES:STORES.filter(s=>s.type===typeFilter);
  let totalRate=0, submittedCnt=0, activeCnt=0;
  let gridHtml='<div class="store-grid">';

  for(const s of targets){
    const data=await getData(s.code,date);
    const cfg=await getConfig(s.code);
    const rate=calcRate(cfg,data);
    const hasAny=!!(data.submittedCheck||data.submittedFac||data.submittedRepair||data.submitted||rate>0);
    totalRate+=rate;
    if(data.submitted)submittedCnt++;
    if(rate>0)activeCnt++;
    const barColor=rate>=80?'#1D9E75':rate>=50?'#BA7517':'#A32D2D';
    const tileClass='store-tile'+(data.submitted?' submitted-tile':hasAny?' has-data':'');
    const subLabel=data.submitted
      ?'<div class="tile-sub">✓전체제출</div>'
      :(data.submittedCheck||data.submittedFac||data.submittedRepair)
        ?'<div class="tile-sub" style="color:var(--warn)">일부제출</div>'
        :rate>0?'<div class="tile-sub" style="color:var(--accent2)">진행중</div>':'';
    gridHtml+=`<div class="${tileClass}" onclick="enterStore('${s.code}')">
      <div class="tile-type">${s.type}</div>
      <div class="tile-name">${s.name}</div>
      <div class="tile-code">${s.code}</div>
      <div class="tile-rate" style="color:${rate>0?barColor:'var(--text2)'}">${rate}%</div>
      ${subLabel}
      <div class="tile-progress"><div class="tile-progress-bar" style="width:${rate}%;background:${barColor}"></div></div>
    </div>`;
  }
  gridHtml+='</div>';

  const avgRate=targets.length?Math.round(totalRate/targets.length):0;
  const isToday=date===todayStr();
  if(summaryEl){
    summaryEl.innerHTML=`
      <div class="stores-sum-card">
        <div class="stores-sum-val" style="color:var(--accent)">${avgRate}%</div>
        <div class="stores-sum-lbl">평균 이행률</div>
      </div>
      <div class="stores-sum-card">
        <div class="stores-sum-val" style="color:var(--ok)">${submittedCnt}<span style="font-size:14px;color:var(--text2)">/${targets.length}</span></div>
        <div class="stores-sum-lbl">전체제출 매장</div>
      </div>
      <div class="stores-sum-card">
        <div class="stores-sum-val" style="color:var(--accent2)">${activeCnt}<span style="font-size:14px;color:var(--text2)">/${targets.length}</span></div>
        <div class="stores-sum-lbl">진행중 매장</div>
      </div>`;
  }
  if(gridEl)gridEl.innerHTML=`
    <div style="font-size:12px;color:var(--text2);margin-bottom:8px">
      ${date} ${isToday?'· 실시간':'· 과거 내역'} · ${targets.length}개 매장
    </div>`+gridHtml;
}

let bulkSelectedStores = []; // 선택된 매장 코드 목록

function toggleBulkChip(code){
  if(bulkSelectedStores.includes(code)){
    bulkSelectedStores=bulkSelectedStores.filter(c=>c!==code);
  } else {
    bulkSelectedStores.push(code);
  }
  document.querySelectorAll('.bulk-chip').forEach(el=>{
    el.classList.toggle('selected', bulkSelectedStores.includes(el.dataset.code));
  });
  document.querySelectorAll('.bulk-sel-count').forEach(el=>{
    el.textContent=bulkSelectedStores.length+'개 매장 선택됨';
  });
}

function bulkSelectAll(all){
  bulkSelectedStores=all?[...STORES.map(s=>s.code)]:[];
  document.querySelectorAll('.bulk-chip[data-code]').forEach(el=>{
    el.classList.toggle('selected',all);
  });
  document.querySelectorAll('.bulk-sel-count').forEach(el=>{
    el.textContent=bulkSelectedStores.length+'개 매장 선택됨';
  });
}
window.bulkSelectAll=bulkSelectAll;

async function loadBulkEditItems(){
  const sec=document.getElementById('bulk-edit-sec').value;
  const sel=document.getElementById('bulk-edit-item');
  sel.innerHTML='<option value="">항목 선택</option>';
  if(!sec)return;
  const cfg=await getConfig(adminStore);
  const items=cfg.checklist[sec]||[];
  items.forEach((it,i)=>{
    const opt=document.createElement('option');
    opt.value=i;
    opt.textContent=`[${it.a}] ${it.n}${it.t?' ⏰'+it.t:''}`;
    sel.appendChild(opt);
  });
  sel.addEventListener('change',async function(){
    if(!this.value&&this.value!=='0')return;
    const cfg2=await getConfig(adminStore);
    const it=cfg2.checklist[sec][parseInt(this.value)];
    if(!it)return;
    document.getElementById('bulk-edit-area').value=it.a||'';
    document.getElementById('bulk-edit-name').value=it.n||'';
    document.getElementById('bulk-edit-desc').value=it.d||'';
    document.getElementById('bulk-edit-time').value=it.t||'';
  },{once:false});
}
window.loadBulkEditItems=loadBulkEditItems;

async function loadBulkTimeItems(){
  const sec=document.getElementById('bulk-time-sec').value;
  const listEl=document.getElementById('bulk-time-item-list');
  const countEl=document.getElementById('bulk-time-sel-count');
  listEl.innerHTML='<div style="padding:12px;text-align:center;color:var(--text2);font-size:13px">불러오는 중...</div>';
  if(!sec){
    listEl.innerHTML='<div style="padding:12px;text-align:center;color:var(--text2);font-size:13px">대분류를 선택하면 항목이 표시됩니다</div>';
    countEl.textContent='대분류를 먼저 선택해주세요';
    return;
  }
  const cfg=await getConfig(adminStore);
  const items=cfg.checklist[sec]||[];
  if(!items.length){
    listEl.innerHTML='<div style="padding:12px;text-align:center;color:var(--text2);font-size:13px">항목이 없습니다</div>';
    countEl.textContent='항목 없음';
    return;
  }
  listEl.innerHTML=items.map((it,i)=>`
    <div class="bulk-item-check" onclick="toggleBulkTimeItem(${i})">
      <input type="checkbox" id="btc-${i}" value="${i}" checked onchange="updateBulkTimeCount()">
      <label for="btc-${i}">[${it.a}] ${it.n}${it.d?'<br><span style="font-size:10px;color:var(--text2)">📌 '+it.d+'</span>':''}</label>
      <span class="item-time">${it.t?'⏰ '+it.t:'-'}</span>
    </div>`).join('');
  updateBulkTimeCount();
}
function toggleBulkTimeItem(i){
  const cb=document.getElementById('btc-'+i);
  if(cb){cb.checked=!cb.checked;updateBulkTimeCount();}
}
function updateBulkTimeCount(){
  const checked=document.querySelectorAll('#bulk-time-item-list input[type=checkbox]:checked').length;
  const total=document.querySelectorAll('#bulk-time-item-list input[type=checkbox]').length;
  const el=document.getElementById('bulk-time-sel-count');
  if(el)el.textContent=checked+' / '+total+' 항목 선택됨';
}
function bulkTimeSelectAll(all){
  document.querySelectorAll('#bulk-time-item-list input[type=checkbox]').forEach(cb=>cb.checked=all);
  updateBulkTimeCount();
}

async function bulkAddItem(){
  if(!bulkSelectedStores.length)return showToast('매장을 하나 이상 선택해주세요');
  let sec=document.getElementById('bulk-add-sec').value;
  const newSecName=(document.getElementById('bulk-new-sec-name').value||'').trim();
  if(sec==='__new__'){
    if(!newSecName)return showToast('새 대분류명을 입력해주세요');
    sec=newSecName;
  }
  if(!sec)return showToast('대분류를 선택해주세요');
  const a=(document.getElementById('bulk-add-area').value||'').trim();
  const n=(document.getElementById('bulk-add-name').value||'').trim();
  const d=(document.getElementById('bulk-add-desc').value||'').trim();
  const t=document.getElementById('bulk-add-time').value||'';
  if(!n)return showToast('항목명을 입력해주세요');
  const ok=await showConfirm('일괄 추가',
    '"'+n+'" 항목을 '+bulkSelectedStores.length+'개 매장에 추가하시겠습니까?',
    'primary','➕');
  if(!ok)return;
  showOverlay('전체 매장 적용 중...');
  let successCnt=0,failCnt=0;
  for(const code of bulkSelectedStores){
    try{
      const cfg=await getConfig(code);
      if(!cfg.checklist[sec])cfg.checklist[sec]=[];
      // 이미 같은 항목명이 있으면 스킵
      const already=cfg.checklist[sec].some(it=>it.n===n);
      if(!already){
        const newItem={a:a||'기타',n};
        if(t)newItem.t=t;
        if(d)newItem.d=d;
        cfg.checklist[sec].push(newItem);
        await setConfig(code,cfg);
      }
      successCnt++;
    }catch(e){failCnt++;}
  }
  hideOverlay();
  const res=document.getElementById('bulk-add-result');
  res.className='bulk-result ok';
  res.textContent='✅ '+successCnt+'개 매장 적용 완료'+(failCnt?' / '+failCnt+'개 오류':'');
  showToast('"'+n+'" 항목 일괄 추가 완료!');
}

async function bulkUpdateItem(){
  if(!bulkSelectedStores.length)return showToast('매장을 하나 이상 선택해주세요');
  const sec=document.getElementById('bulk-edit-sec').value;
  const idx=document.getElementById('bulk-edit-item').value;
  if(!sec)return showToast('대분류를 선택해주세요');
  if(idx===''||idx===null)return showToast('항목을 선택해주세요');
  const a=(document.getElementById('bulk-edit-area').value||'').trim();
  const n=(document.getElementById('bulk-edit-name').value||'').trim();
  const d=(document.getElementById('bulk-edit-desc').value||'').trim();
  const t=document.getElementById('bulk-edit-time').value||'';
  if(!n)return showToast('변경할 항목명을 입력해주세요');
  // 기준 매장에서 원본 항목명 가져오기
  const baseCfg=await getConfig(adminStore);
  const baseItem=baseCfg.checklist[sec]&&baseCfg.checklist[sec][parseInt(idx)];
  if(!baseItem)return showToast('기준 항목을 찾을 수 없습니다');
  const origName=baseItem.n;
  const ok=await showConfirm('일괄 수정','"'+origName+'" → "'+n+'"\n'+bulkSelectedStores.length+'개 매장에 적용하시겠습니까?','primary','✏️');
  if(!ok)return;
  showOverlay('전체 매장 적용 중...');
  let successCnt=0,failCnt=0,skipCnt=0;
  for(const code of bulkSelectedStores){
    try{
      const cfg=await getConfig(code);
      if(!cfg.checklist[sec]){skipCnt++;continue;}
      // 해당 매장에서 같은 항목명 찾기
      const itemIdx=cfg.checklist[sec].findIndex(it=>it.n===origName);
      if(itemIdx===-1){skipCnt++;continue;}
      const updItem={a:a||'기타',n};
      if(t)updItem.t=t; else delete updItem.t;
      if(d)updItem.d=d; else delete updItem.d;
      cfg.checklist[sec][itemIdx]=updItem;
      await setConfig(code,cfg);
      successCnt++;
    }catch(e){failCnt++;}
  }
  hideOverlay();
  const res=document.getElementById('bulk-edit-result');
  res.className='bulk-result ok';
  res.textContent='✅ '+successCnt+'개 매장 적용'+(skipCnt?' / '+skipCnt+'개 항목 없어 스킵':'')+(failCnt?' / '+failCnt+'개 오류':'');
  showToast('일괄 수정 완료!');
}

async function bulkUpdateTime(){
  if(!bulkSelectedStores.length)return showToast('매장을 하나 이상 선택해주세요');
  const sec=document.getElementById('bulk-time-sec').value;
  if(!sec)return showToast('대분류를 선택해주세요');
  // 선택된 체크박스 항목들 수집
  const checkedBoxes=[...document.querySelectorAll('#bulk-time-item-list input[type=checkbox]:checked')];
  if(!checkedBoxes.length)return showToast('항목을 하나 이상 선택해주세요');
  const t=document.getElementById('bulk-time-val').value||'';
  // 선택 항목들의 원본 이름 수집 (기준 매장 기준)
  const baseCfg=await getConfig(adminStore);
  const baseItems=baseCfg.checklist[sec]||[];
  const selectedNames=checkedBoxes.map(cb=>{
    const it=baseItems[parseInt(cb.value)];
    return it?it.n:null;
  }).filter(Boolean);
  if(!selectedNames.length)return showToast('유효한 항목이 없습니다');
  const ok=await showConfirm('시간 일괄 설정',
    selectedNames.length+'개 항목 · 마감시간: '+(t||'제거')+'\n'+bulkSelectedStores.length+'개 매장에 적용하시겠습니까?',
    'primary','⏰');
  if(!ok)return;
  showOverlay('전체 매장 적용 중...');
  let successCnt=0,failCnt=0,skipCnt=0;
  for(const code of bulkSelectedStores){
    try{
      const cfg=await getConfig(code);
      if(!cfg.checklist[sec]){skipCnt+=selectedNames.length;continue;}
      let changed=false;
      for(const origName of selectedNames){
        const itemIdx=cfg.checklist[sec].findIndex(it=>it.n===origName);
        if(itemIdx===-1){skipCnt++;continue;}
        if(t)cfg.checklist[sec][itemIdx].t=t;
        else delete cfg.checklist[sec][itemIdx].t;
        changed=true;
        successCnt++;
      }
      if(changed)await setConfig(code,cfg);
    }catch(e){failCnt++;}
  }
  hideOverlay();
  const res=document.getElementById('bulk-time-result');
  res.className='bulk-result ok';
  res.textContent='✅ '+successCnt+'건 적용'+(skipCnt?' / '+skipCnt+'건 스킵':'')+(failCnt?' / '+failCnt+'건 오류':'');
  showToast('마감시간 일괄 설정 완료!');
  // 리스트 새로고침 (시간 업데이트 반영)
  await loadBulkTimeItems();
}

// ── 드래그앤드롭 (마우스) ──
function onDragStart(e,sec,idx){
  dragSec=sec;dragIdx=idx;
  e.dataTransfer.effectAllowed='move';
  setTimeout(()=>e.target.classList.add('dragging'),0);
}
function onDragOver(e,idx){
  e.preventDefault();e.dataTransfer.dropEffect='move';
  dragOverIdx=idx;
  document.querySelectorAll('.adm-item').forEach(el=>el.classList.remove('drag-over'));
  e.currentTarget.classList.add('drag-over');
}
function onDragLeave(e){e.currentTarget.classList.remove('drag-over');}
async function onDrop(e,sec,toIdx){
  e.preventDefault();
  document.querySelectorAll('.adm-item').forEach(el=>{el.classList.remove('drag-over');el.classList.remove('dragging');});
  if(dragSec!==sec||dragIdx===toIdx||dragIdx===null)return;
  showOverlay('순서 저장 중...');
  const cfg=await getConfig(adminStore);
  const items=cfg.checklist[sec];
  const [moved]=items.splice(dragIdx,1);
  items.splice(toIdx,0,moved);
  await setConfig(adminStore,cfg);
  dragSec=null;dragIdx=null;dragOverIdx=null;
  hideOverlay();showToast('순서가 저장됐습니다');renderHomeBody();
}
function onDragEnd(e){
  e.target.classList.remove('dragging');
  document.querySelectorAll('.adm-item').forEach(el=>el.classList.remove('drag-over'));
}

// ── 터치 드래그 (모바일) ──
let touchSec=null,touchFromIdx=null,touchClone=null,touchScrollY=0;
function onTouchStart(e,sec,idx){
  if(e.target.className!=='drag-handle'&&!e.target.closest('.drag-handle'))return;
  touchSec=sec;touchFromIdx=idx;
  const el=e.currentTarget;
  const rect=el.getBoundingClientRect();
  touchClone=el.cloneNode(true);
  touchClone.style.cssText=`position:fixed;left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;opacity:.85;z-index:9999;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.2);border-radius:8px;background:var(--card)`;
  document.body.appendChild(touchClone);
  el.classList.add('dragging');
  touchScrollY=window.scrollY;
}
function onTouchMove(e){
  if(!touchClone)return;
  e.preventDefault();
  const t=e.touches[0];
  touchClone.style.top=(t.clientY-30)+'px';
  touchClone.style.left=(t.clientX-20)+'px';
  const under=document.elementFromPoint(t.clientX,t.clientY);
  const item=under?under.closest('.adm-item[data-idx]'):null;
  document.querySelectorAll('.adm-item').forEach(el=>el.classList.remove('drag-over'));
  if(item&&item.dataset.sec===touchSec)item.classList.add('drag-over');
}
async function onTouchEnd(e,sec,idx){
  if(!touchClone){touchSec=null;touchFromIdx=null;return;}
  const t=e.changedTouches[0];
  const under=document.elementFromPoint(t.clientX,t.clientY);
  const item=under?under.closest('.adm-item[data-idx]'):null;
  if(touchClone){touchClone.remove();touchClone=null;}
  document.querySelectorAll('.adm-item').forEach(el=>{el.classList.remove('dragging');el.classList.remove('drag-over');});
  const toIdx=item&&item.dataset.sec===touchSec?parseInt(item.dataset.idx):null;
  if(toIdx!==null&&toIdx!==touchFromIdx){
    showOverlay('순서 저장 중...');
    const cfg=await getConfig(adminStore);
    const items=cfg.checklist[touchSec];
    const [moved]=items.splice(touchFromIdx,1);
    items.splice(toIdx,0,moved);
    await setConfig(adminStore,cfg);
    hideOverlay();showToast('순서가 저장됐습니다');renderHomeBody();
  }
  touchSec=null;touchFromIdx=null;
}

      </select>
    </div>
  </div>
  <div id="rpt-body"><div class="empty-msg">불러오는 중...</div></div>`;

}
async function loadReport(){
  const dateEl=document.getElementById('rpt-date');
  const stEl=document.getElementById('rpt-store');
  if(!dateEl||!stEl)return;
  const date=dateEl.value;
  const sf=stEl.value;
  const body=document.getElementById('rpt-body');
  if(!date){body.innerHTML='<div class="empty-msg">날짜를 선택해주세요</div>';return;}
  body.innerHTML='<div class="empty-msg">불러오는 중...</div>';
  const targets=sf==='all'?STORES:STORES.filter(s=>s.code===sf);
  let totalDone=0,totalItems=0,subCnt=0,cards='';
  for(const s of targets){
    const data=await getData(s.code,date);
    const cfg=await getConfig(s.code);
    const total=countTotal(cfg);
    const done=countDone(cfg,data);
    const rate=total?Math.round(done/total*100):0;
    totalDone+=done;totalItems+=total;
    if(data.submitted)subCnt++;
    const bc=rate>=80?'#1D9E75':rate>=50?'#BA7517':'#A32D2D';
    const badge=data.submitted?'<span class="badge badge-ok">전체제출</span>':
      (data.submittedCheck||data.submittedFac||data.submittedRepair)?'<span class="badge badge-warn">일부제출</span>':
      rate>0?'<span class="badge badge-warn">진행중</span>':'<span class="badge badge-no">미시작</span>';
    const subDetail=`<span>${data.submittedCheck?'✓체크':'·체크'}</span><span>${data.submittedFac?'✓시설':'·시설'}</span><span>${data.submittedRepair?'✓보수':'·보수'}</span>`;
    cards+=`<div class="rpt-card">
      <div class="rpt-card-top">
        <div><div class="rpt-store">${s.name}</div><div style="font-size:11px;color:var(--text2)">${s.code} · ${s.type}</div></div>
        <div style="text-align:right"><div class="rpt-rate" style="color:${bc}">${rate}%</div>${badge}</div>
      </div>
      <div class="rpt-bar-wrap"><div class="rpt-bar" style="width:${rate}%;background:${bc}"></div></div>
      <div class="rpt-meta"><span>${done} / ${total} 완료</span>${subDetail}${data.submittedAt?`<span>${data.submittedAt.slice(11,16)} 완료</span>`:''}</div>
    </div>`;
  }
  const avg=totalItems?Math.round(totalDone/totalItems*100):0;
  const summary=`<div class="summary-cards">
    <div class="sum-card"><div class="sum-val" style="color:var(--accent)">${avg}%</div><div class="sum-lbl">평균 이행률</div></div>
    <div class="sum-card"><div class="sum-val" style="color:var(--ok)">${subCnt}<span style="font-size:16px;color:var(--text2)"> / ${targets.length}</span></div><div class="sum-lbl">제출 완료 매장</div></div>
  </div>`;
  body.innerHTML=summary+(cards||'<div class="empty-msg">해당 날짜에 데이터가 없습니다</div>');
}

// 현재 시각 HH:MM 반환
function nowHHMM(){
  const n=new Date();
  return n.getHours().toString().padStart(2,'0')+':'+n.getMinutes().toString().padStart(2,'0');
}
// 마감시간 상태 반환
function deadlineStatus(deadline){
  if(!deadline)return 'none';
  const now=nowHHMM();
  const diff=(parseInt(deadline.replace(':',''))-parseInt(now.replace(':',''))); // 분 차이 근사
  if(diff<0)return 'over';      // 마감 지남
  if(diff<=60)return 'warn';    // 1시간 이내
  return 'ok';
}
function deadlineBadge(deadline){
  if(!deadline)return '';
  const st=deadlineStatus(deadline);
  const label={'ok':'⏰ '+deadline+'까지','warn':'⚠️ '+deadline+'까지 (임박)','over':'🔴 '+deadline+' 마감'}[st];
  return `<span class="deadline-badge ${st}">${label}</span>`;
}

function setSort(mode){
  checklistSort=mode;
  ['default','asc','desc','undone'].forEach(m=>{
    const el=document.getElementById('sort-'+m);
    if(el)el.classList.toggle('active',m===mode);
  });
  renderChecklist();
}

async function renderChecklist(){
  showOverlay('체크리스트 불러오는 중...');
  const cfg=await getConfig(curStore.code);
  const data=await getData(curStore.code,curDate());
  const staffList=await getStaff(curStore.code);
  hideOverlay();

  // 전체 항목을 flat 배열로 만들어 정렬에 활용
  let allItems=[]; // {sec, item, i, k, st, sf}
  for(const[sec,items]of Object.entries(cfg.checklist)){
    items.forEach((item,i)=>{
      const k=sec+':'+i;
      const st=(data.checks||{})[k]||'';
      const sf=(data.checks||{})[k+'_staff']||'';
      allItems.push({sec,item,i,k,st,sf});
    });
  }

  const now=nowHHMM();
  let html='';

  if(checklistSort==='default'){
    // 기존 분류별 표시
    for(const[sec,items]of Object.entries(cfg.checklist)){
      const done=items.filter((_,i)=>['done','na'].includes((data.checks||{})[sec+':'+i])).length;
      html+=`<div class="sec-card">
        <div class="sec-hdr" onclick="toggleSec(this)">
          <span class="sec-title">${sec}</span>
          <span class="sec-cnt">${done}/${items.filter(it=>!it.hidden).length}</span>
          <span class="sec-arr open">▼</span>
        </div>
        <div class="sec-body open">
          ${items.map((item,i)=>buildCheckItem(sec,item,i,data,staffList,now)).join('')}
        </div>
      </div>`;
    }
  } else {
    // 정렬 모드: flat 리스트
    let sorted=[...allItems];
    if(checklistSort==='asc'){
      sorted.sort((a,b)=>{
        const ta=a.item.t||'99:99', tb=b.item.t||'99:99';
        return ta.localeCompare(tb);
      });
    } else if(checklistSort==='desc'){
      sorted.sort((a,b)=>{
        const ta=a.item.t||'00:00', tb=b.item.t||'00:00';
        return tb.localeCompare(ta);
      });
    } else if(checklistSort==='undone'){
      sorted.sort((a,b)=>{
        const doneA=['done','na'].includes(a.st)?1:0;
        const doneB=['done','na'].includes(b.st)?1:0;
        if(doneA!==doneB)return doneA-doneB;
        const ta=a.item.t||'99:99', tb=b.item.t||'99:99';
        return ta.localeCompare(tb);
      });
    }
    const done=sorted.filter(x=>['done','na'].includes(x.st)).length;
    html=`<div class="sec-card">
      <div class="sec-hdr" onclick="toggleSec(this)">
        <span class="sec-title">전체 항목</span>
        <span class="sec-cnt">${done}/${sorted.length}</span>
        <span class="sec-arr open">▼</span>
      </div>
      <div class="sec-body open">
        ${sorted.map(({sec,item,i})=>buildCheckItem(sec,item,i,data,staffList,now)).join('')}
      </div>
    </div>`;
  }

  document.getElementById('app-content').innerHTML=html;
  updateSubmitBar(data);
}

function buildCheckItem(sec,item,i,data,staffList,now){
  if(item.hidden)return ''; // 숨김 항목 체크시트에서 미표시
  const k=sec+':'+i;
  const st=(data.checks||{})[k]||'';
  const sf=(data.checks||{})[k+'_staff']||'';
  const opts='<option value="">직원선택</option>'+staffList.map(n=>`<option${n===sf?' selected':''}>${n}</option>`).join('');
  // 마감시간 체크
  const deadline=item.t||'';
  const expired=deadline&&now>deadline&&!['done','na'].includes(st);
  const disabledAttr=expired?'disabled title="마감시간이 지났습니다"':'';
  const dBadge=deadlineBadge(deadline);
  return `<div class="ci${expired?' expired':''}">
    <div class="ci-num">${i+1}</div>
    <div class="ci-info">
      <div class="ci-area">${sec} · ${item.a}</div>
      <div class="ci-name">${item.n}</div>
      ${item.d?`<div class="ci-desc">📌 ${item.d}</div>`:''}
      ${dBadge}
    </div>
    <div class="ci-controls">
      <div class="status-btns">
        <button class="sbtn${st==='done'?' done':''}" onclick="setSt('${k}','done')" ${expired&&st!=='done'?disabledAttr:''}>✓</button>
        <button class="sbtn${st==='fail'?' fail':''}" onclick="setSt('${k}','fail')" ${expired&&st!=='fail'?disabledAttr:''}>✗</button>
        <button class="sbtn${st==='na'?' na':''}" onclick="setSt('${k}','na')" ${disabledAttr}>-</button>
      </div>
      <select class="staff-sel" onchange="setStaffF('${k}',this.value)" ${expired?'disabled':''}>${opts}</select>
    </div>
  </div>`;
}

// 이미지 압축 (최대 800px, quality 0.65)
function compressImage(file, maxPx=800, quality=0.65){
  return new Promise((res,rej)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      let w=img.width, h=img.height;
      if(w>maxPx||h>maxPx){
        if(w>h){h=Math.round(h*maxPx/w);w=maxPx;}
        else{w=Math.round(w*maxPx/h);h=maxPx;}
      }
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      res(canvas.toDataURL('image/jpeg',quality));
    };
    img.onerror=rej;
    img.src=url;
  });
}

async function updateSubmitBar(data){
  const key=tabSubmitKey();
  const btnSubmit=document.getElementById('btn-submit');
  const btnUnlock=document.getElementById('btn-unlock');
  if(!btnSubmit)return;
  if(key===null){
    btnSubmit.style.display='none';
    btnUnlock.style.display='none';
    return;
  }
  btnSubmit.style.display='';

  // 마감보고는 closing 데이터에서 제출 상태 확인
  let isSubmitted=false;
  if(curTab===3){
    const cl=await getClosing(curStore.code,curDate());
    isSubmitted=!!(cl&&cl.submitted);
  } else {
    isSubmitted=!!(data&&data[key]);
  }

  if(isSubmitted){
    btnSubmit.textContent='✓ '+tabLabel()+' 제출완료';
    btnSubmit.style.background='#1D9E75';
    btnSubmit.disabled=true;
    btnUnlock.style.display='';
  } else {
    btnSubmit.textContent='✅ '+tabLabel()+' 제출';
    btnSubmit.style.background='';
    btnSubmit.disabled=false;
    btnUnlock.style.display='none';
  }
}

async function submitCurrent(){
  const key=tabSubmitKey();
  if(!key)return;

  // 마감보고 탭(tab3)은 별도 처리
  if(curTab===3){
    await saveClosingData(); // 먼저 현재 입력값 저장
    const cl=await getClosing(curStore.code,curDate());
    if(cl.submitted){showToast('이미 제출되었습니다. 수정 버튼을 눌러주세요');return;}
    if(!confirm(`${curDate()} [마감보고]를 제출하시겠습니까?\n제출 후 수정 버튼으로 다시 수정 가능합니다.`))return;
    showOverlay('제출 중...');
    cl.submitted=true;
    cl.submittedAt=new Date().toISOString();
    await setClosing(curStore.code,curDate(),cl);
    // dayData에도 플래그 저장 (이행률 보고용)
    const data=await getData(curStore.code,curDate());
    data.submittedClosing=true;
    data.submittedClosingAt=new Date().toISOString();
    await setData(curStore.code,curDate(),data);
    hideOverlay();
    showToast('[마감보고] 제출 완료!');
    updateSubmitBar(data);
    await renderClosing();
    return;
  }

  const data=await getData(curStore.code,curDate());
  if(data[key]){showToast('이미 제출되었습니다. 수정 버튼을 눌러주세요');return;}
  const label=tabLabel();
  if(!confirm(`${curDate()} [${label}]을 제출하시겠습니까?\n제출 후 수정 버튼으로 다시 수정 가능합니다.`))return;
  showOverlay('제출 중...');
  data[key]=true;
  data[key+'At']=new Date().toISOString();
  if(data.submittedCheck&&data.submittedFac&&data.submittedRepair){
    data.submitted=true;data.submittedAt=new Date().toISOString();
  }
  await setData(curStore.code,curDate(),data);
  hideOverlay();
  showToast('['+label+'] 제출 완료!');
  updateSubmitBar(data);
}
async function unlockCurrent(){
  const key=tabSubmitKey();
  if(!key)return;
  const label=tabLabel();
  if(!confirm(`[${label}] 제출을 취소하고 수정하시겠습니까?`))return;
  showOverlay('수정 모드로 전환 중...');

  // 마감보고는 closing 데이터에서도 해제
  if(curTab===3){
    const cl=await getClosing(curStore.code,curDate());
    cl.submitted=false;
    delete cl.submittedAt;
    await setClosing(curStore.code,curDate(),cl);
    const data=await getData(curStore.code,curDate());
    data.submittedClosing=false;
    delete data.submittedClosingAt;
    await setData(curStore.code,curDate(),data);
    hideOverlay();
    showToast('[마감보고] 수정 가능 상태로 변경됐습니다');
    updateSubmitBar(data);
    await renderClosing();
    return;
  }

  const data=await getData(curStore.code,curDate());
  data[key]=false;
  delete data[key+'At'];
  data.submitted=false;
  delete data.submittedAt;
  await setData(curStore.code,curDate(),data);
  hideOverlay();
  showToast('['+label+'] 수정 가능 상태로 변경됐습니다');
  updateSubmitBar(data);
}

function showSecEditRow(eid){

}
function hideSecEditRow(eid){
  const row = document.getElementById('sec-edit-row-'+eid);

async function admSaveSec(oldSec){
  const eid = oldSec.replace(/[^\w가-힣]/g,'_');
  const newSec = (document.getElementById('sec-edit-inp-'+eid).value||'').trim();
  if(!newSec) return showToast('분류명을 입력해주세요');
  if(newSec === oldSec){ hideSecEditRow(eid); return; }
  const ok = await showConfirm('대분류 수정', '"'+oldSec+'" → "'+newSec+'"\n으로 수정하시겠습니까?', 'primary', '✏️');
  if(!ok) return;
  showOverlay('저장 중...');
  const cfg = await getConfig(adminStore);
  const entries = Object.entries(cfg.checklist);
  const idx = entries.findIndex(([k])=>k===oldSec);
  if(idx===-1){ hideOverlay(); return showToast('항목을 찾을 수 없습니다'); }
  entries[idx][0] = newSec;
  cfg.checklist = Object.fromEntries(entries);
  await setConfig(adminStore, cfg);
  hideOverlay(); showToast('"'+newSec+'" 으로 수정됐습니다'); renderHomeBody();

async function admDelSec(sec){

async function admAddSec(){

// ── 목표매출 엑셀 업로드 (SheetJS) ──
async function uploadTargetExcel(inp){
  const file=inp.files[0];
  if(!file)return;
  const resultEl=document.getElementById('excel-result');
  resultEl.textContent='처리 중...';
  try{
    const XLSX=window.XLSX;
    if(!XLSX){resultEl.textContent='❌ 엑셀 라이브러리 로딩 중... 잠시 후 재시도';return;}
    const ab=await file.arrayBuffer();
    const wb=XLSX.read(ab,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true});
    let cnt=0,errors=[];
    for(const row of rows){
      if(!row||row.length<3)continue;
      const storeCode=String(row[0]||'').trim().toUpperCase();
      const dateRaw=String(row[1]||'').trim().replace(/-/g,'');
      const amount=parseInt(String(row[2]||'').replace(/,/g,''));
      if(!storeCode.match(/^M\d+$/)||dateRaw.length!==8||isNaN(amount)){errors.push(storeCode+'/'+dateRaw);continue;}
      const path='targets/'+storeCode+'/'+dateRaw;
      await fbSet(path,amount);
      cnt++;
    }
    resultEl.style.color='var(--ok)';
    resultEl.textContent='✅ '+cnt+'건 저장 완료'+(errors.length?' / 오류: '+errors.slice(0,3).join(','):'');
  }catch(e){
    resultEl.style.color='var(--danger)';
    resultEl.textContent='❌ 오류: '+e.message;
  }
}

async function renderClosingReport(body){
  body.innerHTML=`
    <div class="stores-filter">
      <div class="stores-filter-row">
        <label>📅 날짜</label>
        <input type="date" id="cr-date" value="${todayStr()}" onchange="loadClosingReport()">
        <select id="cr-store" onchange="loadClosingReport()">
          <option value="all">전체 매장</option>
          ${STORES.map(s=>`<option value="${s.code}">${s.name}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="stores-summary" id="cr-summary"></div>
    <div id="cr-body"><div class="empty-msg">불러오는 중...</div></div>`;
  await loadClosingReport();
}
async function loadClosingReport(){
  const dateEl=document.getElementById('cr-date');
  const stEl=document.getElementById('cr-store');
  if(!dateEl||!stEl)return;
  const date=dateEl.value;
  const sf=stEl.value;
  const body=document.getElementById('cr-body');
  const summaryEl=document.getElementById('cr-summary');
  if(!date){body.innerHTML='<div class="empty-msg">날짜를 선택해주세요</div>';return;}
  body.innerHTML='<div class="empty-msg">불러오는 중...</div>';
  const targets=sf==='all'?STORES:STORES.filter(s=>s.code===sf);
  let submittedCnt=0, reportedCnt=0, totalSales=0;
  let html='';

  for(const s of targets){
    const cl=await getClosing(s.code,date);
    const fb=await getFeedback(s.code,date);
    const target=await getTarget(s.code,date.replace(/-/g,''));
    const salesVal=cl.sales?parseInt(cl.sales):0;
    const targetVal=target?parseInt(target):0;
    const achievePct=targetVal>0?Math.min(Math.round(salesVal/targetVal*100),999):0;
    const achieveColor=achievePct>=100?'#1D9E75':achievePct>=80?'#BA7517':'#A32D2D';
    const submitted=!!(cl.submitted);
    const hasData=!!(cl.sales||cl.attend||cl.special||cl.stock||cl.photos?.length);
    if(submitted)submittedCnt++;
    if(hasData)reportedCnt++;
    if(salesVal>0)totalSales+=salesVal;

    // 전체보기일 때는 데이터 없는 매장도 미보고로 표시
    const cardBorder=submitted?'border-color:var(--ok)':hasData?'border-color:var(--warn)':'';
    const statusBadge=submitted
      ?'<span class="badge badge-ok">✓ 제출완료</span>'
      :hasData
        ?'<span class="badge badge-warn">작성중</span>'
        :'<span class="badge badge-no">미보고</span>';

    html+=`<div class="rpt-card" style="margin-bottom:10px;${cardBorder}">
      <div class="rpt-card-top">
        <div>
          <div class="rpt-store">${s.name}</div>
          <div style="font-size:11px;color:var(--text2)">${s.code} · ${s.type}${cl.reporter?' · 보고자: '+cl.reporter:''}</div>
        </div>
        <div style="text-align:right">${statusBadge}</div>
      </div>
      ${hasData?`
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;margin-bottom:8px">
        <div style="background:var(--inp-bg);border-radius:6px;padding:6px 8px">
          <div style="color:var(--text2);margin-bottom:2px">목표매출</div>
          <div style="font-weight:600">${targetVal>0?targetVal.toLocaleString()+'원':'미설정'}</div>
        </div>
        <div style="background:var(--inp-bg);border-radius:6px;padding:6px 8px">
          <div style="color:var(--text2);margin-bottom:2px">금일매출 ${achievePct>0?`<span style="color:${achieveColor};font-weight:700">${achievePct}%</span>`:''}</div>
          <div style="font-weight:600">${salesVal>0?salesVal.toLocaleString()+'원':'미입력'}</div>
        </div>
        ${cl.attend?`<div style="background:var(--inp-bg);border-radius:6px;padding:6px 8px;grid-column:1/-1"><div style="color:var(--text2);margin-bottom:2px">근태</div><div>${cl.attend}</div></div>`:''}
        ${cl.stock?`<div style="background:var(--inp-bg);border-radius:6px;padding:6px 8px"><div style="color:var(--text2);margin-bottom:2px">익일입하</div><div style="font-weight:600">${cl.stock} PCS</div></div>`:''}
        ${cl.special?`<div style="background:var(--inp-bg);border-radius:6px;padding:6px 8px;grid-column:1/-1"><div style="color:var(--text2);margin-bottom:2px">특이사항</div><div>${cl.special}</div></div>`:''}
      </div>
      ${cl.photos&&cl.photos.length?`<div class="photo-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:8px">${cl.photos.map(p=>`<div class="photo-thumb"><img src="${p}"></div>`).join('')}</div>`:''}
      ${fb?`<div style="border-top:1px solid var(--border);margin-top:8px;padding-top:8px">
        <div style="font-size:11px;font-weight:600;color:var(--accent2);margin-bottom:4px">💬 피드백: ${fb.writer||''}</div>
        <div style="font-size:12px;white-space:pre-wrap">${fb.content||''}</div>
        ${fb.photos&&fb.photos.length?`<div class="photo-grid" style="margin-top:6px;grid-template-columns:repeat(3,1fr)">${fb.photos.map(p=>`<div class="photo-thumb"><img src="${p}"></div>`).join('')}</div>`:''}
      </div>`:''}
      `:'<div style="font-size:12px;color:var(--text2);text-align:center;padding:8px 0">마감보고 미기입</div>'}
      <button class="btn-edit-item" style="width:100%;margin-top:8px;padding:8px" onclick="enterStore('${s.code}')">매장 체크리스트 보기</button>
    </div>`;
  }

  // 요약 카드
  if(summaryEl){
    summaryEl.innerHTML=`
      <div class="stores-sum-card">
        <div class="stores-sum-val" style="color:var(--ok)">${submittedCnt}<span style="font-size:14px;color:var(--text2)">/${targets.length}</span></div>
        <div class="stores-sum-lbl">제출 완료</div>
      </div>
      <div class="stores-sum-card">
        <div class="stores-sum-val" style="color:var(--warn)">${reportedCnt}<span style="font-size:14px;color:var(--text2)">/${targets.length}</span></div>
        <div class="stores-sum-lbl">보고 있음</div>
      </div>
      <div class="stores-sum-card">
        <div class="stores-sum-val" style="color:var(--accent);font-size:16px">${totalSales>0?Math.round(totalSales/10000).toLocaleString()+'만':'미입력'}</div>
        <div class="stores-sum-lbl">합산 매출</div>
      </div>`;
  }
  body.innerHTML=html||'<div class="empty-msg">해당 날짜 마감보고 데이터가 없습니다</div>';
}
