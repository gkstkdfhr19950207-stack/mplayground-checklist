<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MP체크리스트">
<meta name="theme-color" content="#1a1a2e">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>MPLAYGROUND 체크리스트</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#1a1a2e;--accent:#D85A30;--accent2:#185FA5;
  --ok:#1D9E75;--warn:#BA7517;--danger:#A32D2D;
  --bg:#f4f4f0;--card:#fff;--text:#1a1a2e;--text2:#666;
  --border:#e4e4e0;--inp-bg:#f8f8f5;
  --shadow:0 2px 10px rgba(0,0,0,0.07);
}
@media(prefers-color-scheme:dark){
  :root{--bg:#111113;--card:#1c1c1e;--text:#f0f0f0;--text2:#8e8e93;--border:#2c2c2e;--inp-bg:#2c2c2e;--shadow:0 2px 10px rgba(0,0,0,0.3);}
}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);font-size:14px}
#root{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
.screen{display:none;flex-direction:column;height:100%;overflow:hidden}
.screen.active{display:flex}

/* LOGIN */
#s-login{align-items:center;justify-content:center;background:linear-gradient(160deg,#1a1a2e,#0f3460)}
.login-box{width:100%;max-width:340px;padding:24px 20px}
.login-logo{color:#fff;font-size:22px;font-weight:700;letter-spacing:3px;margin-bottom:4px}
.login-sub{color:rgba(255,255,255,0.45);font-size:12px;margin-bottom:30px}
.login-card{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:18px;padding:26px 22px;backdrop-filter:blur(12px)}
.login-card h2{color:#fff;font-size:15px;font-weight:600;margin-bottom:20px}
.fg{margin-bottom:14px}
.fg label{display:block;color:rgba(255,255,255,0.6);font-size:12px;margin-bottom:5px}
.fg input{width:100%;padding:11px 14px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:10px;color:#fff;font-size:14px;font-family:inherit;outline:none}
.fg input:focus{border-color:var(--accent)}
.fg input::placeholder{color:rgba(255,255,255,0.3)}
.btn-login{width:100%;padding:13px;background:var(--accent);border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:4px}
.login-err{color:#ff6b6b;font-size:12px;text-align:center;margin-top:10px;display:none}
.install-hint{margin-top:16px;color:rgba(255,255,255,0.4);font-size:11px;text-align:center;line-height:1.7;background:rgba(255,255,255,0.04);border-radius:10px;padding:12px}

/* SYNC OVERLAY */
#sync-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px}
#sync-overlay.show{display:flex}
.sync-spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sync-msg{color:#fff;font-size:14px}

/* HEADER */
.hdr{background:var(--primary);color:#fff;padding-top:env(safe-area-inset-top,0);flex-shrink:0}
.hdr-inner{padding:12px 14px;display:flex;align-items:center;gap:10px}
.hdr-back{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;padding:4px;line-height:1}
.hdr-title{flex:1}
.hdr-title .t1{font-size:16px;font-weight:700}
.hdr-title .t2{font-size:11px;color:rgba(255,255,255,0.5)}
.hdr-btn{background:rgba(255,255,255,0.12);border:none;color:#fff;border-radius:8px;padding:6px 11px;font-size:12px;cursor:pointer;font-family:inherit}
.sync-badge{font-size:11px;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.7);white-space:nowrap}
.sync-badge.saving{background:rgba(255,200,0,0.25);color:#ffe066}
.sync-badge.saved{background:rgba(46,204,113,0.25);color:#7effc0}
.sync-badge.err{background:rgba(231,76,60,0.3);color:#ff8b8b}

/* HOME */
#s-home{background:var(--bg)}
.home-hdr{background:var(--primary);padding-top:env(safe-area-inset-top,0);flex-shrink:0}
.home-hdr-inner{padding:14px 14px 0}
.home-logo{color:#fff;font-size:18px;font-weight:700;letter-spacing:1px}
.home-hdr-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.home-tabs{display:flex;gap:5px;padding:0 14px 12px;overflow-x:auto}
.home-tabs::-webkit-scrollbar{display:none}
.htab{padding:7px 13px;border:1px solid rgba(255,255,255,0.15);border-radius:8px;background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.7);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0}
.htab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.home-body{flex:1;overflow-y:auto;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0))}

/* STORE GRID */
.store-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.store-tile{background:var(--card);border-radius:14px;padding:14px 12px;box-shadow:var(--shadow);cursor:pointer;position:relative;overflow:hidden;border:1px solid var(--border);transition:opacity .15s}
.store-tile:active{opacity:0.7}
.tile-type{font-size:10px;color:var(--text2);margin-bottom:3px}
.tile-name{font-size:14px;font-weight:700;margin-bottom:1px}
.tile-code{font-size:11px;color:var(--text2)}
.tile-rate{position:absolute;top:10px;right:10px;font-size:13px;font-weight:700;color:var(--accent)}
.tile-sub{position:absolute;bottom:8px;right:8px;font-size:10px;color:var(--ok);font-weight:600}

/* DATE BAR */
.date-bar{background:var(--card);padding:9px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);flex-shrink:0}
.date-bar label{font-size:12px;color:var(--text2)}
.date-bar input[type=date]{border:1px solid var(--border);border-radius:9px;padding:6px 9px;font-size:13px;font-family:inherit;background:var(--inp-bg);color:var(--text);outline:none;flex:1}
.prog-pill{background:var(--primary);color:#fff;border-radius:20px;padding:4px 11px;font-size:12px;font-weight:700;white-space:nowrap}

/* TAB BAR */
.tab-bar{background:var(--card);display:flex;overflow-x:auto;border-bottom:1px solid var(--border);flex-shrink:0}
.tab-bar::-webkit-scrollbar{display:none}
.tb{flex:0 0 auto;padding:11px 14px;border:none;background:none;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;font-family:inherit;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tb.active{color:var(--accent);border-bottom-color:var(--accent)}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding:12px 12px 90px;-webkit-overflow-scrolling:touch}

/* SEC CARD */
.sec-card{background:var(--card);border-radius:14px;margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border)}
.sec-hdr{padding:12px 14px;display:flex;align-items:center;gap:8px;cursor:pointer;background:var(--primary)}
.sec-title{flex:1;font-size:13px;font-weight:600;color:#fff}
.sec-cnt{font-size:11px;color:rgba(255,255,255,0.55);background:rgba(255,255,255,0.1);border-radius:10px;padding:2px 8px}
.sec-arr{font-size:11px;color:rgba(255,255,255,0.5);transition:transform .2s}
.sec-arr.open{transform:rotate(180deg)}
.sec-body{display:none}
.sec-body.open{display:block}

/* CHECK ITEM */
.ci{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px}
.ci:last-child{border-bottom:none}
.ci-num{font-size:11px;color:var(--text2);min-width:16px;padding-top:2px}
.ci-info{flex:1}
.ci-area{font-size:10px;color:var(--text2);margin-bottom:1px}
.ci-name{font-size:13px;line-height:1.4}
.ci-controls{display:flex;flex-direction:column;gap:5px;align-items:flex-end;min-width:94px}
.status-btns{display:flex;gap:3px}
.sbtn{border:1px solid var(--border);background:var(--inp-bg);border-radius:7px;padding:5px 7px;font-size:12px;cursor:pointer;font-weight:600;font-family:inherit;color:var(--text2)}
.sbtn.done{background:#d4edda;border-color:#28a745;color:#155724}
.sbtn.fail{background:#f8d7da;border-color:#dc3545;color:#721c24}
.sbtn.na{background:var(--border);color:var(--text2)}
.staff-sel{border:1px solid var(--border);border-radius:7px;padding:4px 5px;font-size:11px;width:94px;font-family:inherit;background:var(--inp-bg);color:var(--text);outline:none}

/* FAC */
.fac-item{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start}
.fac-item:last-child{border-bottom:none}
.fac-main{flex:1}
.fac-area{font-size:10px;color:var(--text2)}
.fac-name{font-size:13px;margin:2px 0 5px}
.fac-inp{width:100%;border:1px solid var(--border);border-radius:7px;padding:5px 8px;font-size:12px;background:var(--inp-bg);color:var(--text);font-family:inherit;outline:none;margin-bottom:4px}
.fac-done-btn{border:1px solid var(--border);background:var(--inp-bg);border-radius:7px;padding:6px 10px;font-size:11px;cursor:pointer;font-family:inherit;color:var(--text2);white-space:nowrap;min-width:52px;text-align:center}
.fac-done-btn.done{background:#d4edda;border-color:#28a745;color:#155724}

/* REPAIR */
.rr{padding:11px 14px;border-bottom:1px solid var(--border)}
.rr:last-child{border-bottom:none}
.rr-num{font-size:11px;color:var(--text2);margin-bottom:5px}
.rr-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.r-inp,.r-sel,.r-ta{border:1px solid var(--border);border-radius:7px;padding:7px 9px;font-size:12px;background:var(--inp-bg);color:var(--text);font-family:inherit;outline:none;width:100%}
.r-ta{resize:none;height:46px;grid-column:1/-1}

/* MEMO */
.memo-card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);border:1px solid var(--border)}
.memo-card h3{font-size:13px;font-weight:600;margin-bottom:8px;color:var(--primary)}
@media(prefers-color-scheme:dark){.memo-card h3{color:#f0f0f0}}
.memo-ta{width:100%;border:1px solid var(--border);border-radius:7px;padding:8px;font-size:13px;font-family:inherit;color:var(--text);background:var(--inp-bg);outline:none;resize:none}

/* SUBMIT BAR */
.submit-bar{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--border);padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0));display:flex;gap:8px;box-shadow:0 -3px 15px rgba(0,0,0,0.06)}
.btn-save{padding:12px 16px;background:none;border:1px solid var(--border);border-radius:11px;color:var(--text2);font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-submit{flex:1;padding:12px;background:var(--accent);border:none;border-radius:11px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-unlock{padding:12px 14px;background:none;border:1px solid var(--border);border-radius:11px;color:var(--warn);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}

/* ADMIN */
.admin-store-sel{width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-size:13px;font-family:inherit;background:var(--inp-bg);color:var(--text);outline:none;margin-bottom:14px}
.adm-sec{margin-bottom:16px}
.adm-sec-title{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:8px;letter-spacing:.5px;text-transform:uppercase}
.adm-card{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:8px}
.adm-collapse-hdr{padding:12px 14px;display:flex;align-items:center;gap:8px;cursor:pointer;background:var(--inp-bg);border-bottom:1px solid var(--border);user-select:none}
.adm-collapse-title{flex:1;font-size:13px;font-weight:600}
.adm-collapse-cnt{font-size:11px;color:var(--text2);background:var(--card);border-radius:10px;padding:2px 8px;border:1px solid var(--border)}
.adm-collapse-arr{font-size:12px;color:var(--text2);transition:transform .2s;flex-shrink:0}
.adm-collapse-arr.open{transform:rotate(180deg)}
.adm-collapse-body{display:none}
.adm-collapse-body.open{display:block}
.adm-item{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;transition:background .15s}
.adm-item:last-child{border-bottom:none}
.adm-item.dragging{opacity:.35;background:var(--inp-bg)}
.adm-item.drag-over{border-top:2px solid var(--accent2);margin-top:-1px}
.drag-handle{color:var(--text2);font-size:18px;cursor:grab;padding:2px 2px;touch-action:none;flex-shrink:0;line-height:1;opacity:.5}
.drag-handle:active{cursor:grabbing;opacity:1}
.adm-item-info{flex:1;min-width:0}
.adm-item-area{font-size:10px;color:var(--text2);margin-bottom:1px}
.adm-item-name{font-size:13px;line-height:1.4;word-break:keep-all}
.adm-btns{display:flex;gap:3px;flex-shrink:0}
.btn-del{background:#fff0f0;border:1px solid #fcc;color:var(--danger);border-radius:7px;padding:4px 7px;font-size:11px;cursor:pointer;font-family:inherit}
.btn-edit-item{background:#eef4ff;border:1px solid #c0d4f8;color:var(--accent2);border-radius:7px;padding:4px 7px;font-size:11px;cursor:pointer;font-family:inherit}
@media(prefers-color-scheme:dark){
  .btn-del{background:#3a1515;border-color:#5a2020}
  .btn-edit-item{background:#1a2535;border-color:#2a4a7f}
}
.edit-inline-row{padding:8px 12px;display:flex;gap:5px;background:#eef6ff;border-bottom:1px solid var(--border)}
@media(prefers-color-scheme:dark){.edit-inline-row{background:#182030}}
.edit-inline-row input{flex:1;border:1px solid var(--border);border-radius:7px;padding:6px 8px;font-size:12px;font-family:inherit;background:var(--card);color:var(--text);outline:none}
.btn-save-edit{background:var(--ok);border:none;color:#fff;border-radius:7px;padding:6px 10px;font-size:11px;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-cancel-edit{background:none;border:1px solid var(--border);color:var(--text2);border-radius:7px;padding:6px 7px;font-size:11px;cursor:pointer;font-family:inherit}
.add-row{padding:10px 12px;display:flex;gap:6px;background:var(--inp-bg);border-top:1px solid var(--border)}
.add-row input,.add-row select{flex:1;border:1px solid var(--border);border-radius:7px;padding:7px 9px;font-size:13px;font-family:inherit;background:var(--card);color:var(--text);outline:none}
.btn-add{background:var(--accent2);border:none;color:#fff;border-radius:7px;padding:7px 13px;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap}

/* REPORT */
.rpt-filter{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--border)}
.rpt-filter-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rpt-filter label{font-size:12px;color:var(--text2)}
.rpt-filter input[type=date],.rpt-filter select{border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:13px;font-family:inherit;background:var(--inp-bg);color:var(--text);outline:none;flex:1;min-width:110px}
.rpt-card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:8px;box-shadow:var(--shadow);border:1px solid var(--border)}
.rpt-card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.rpt-store{font-size:14px;font-weight:700}
.rpt-rate{font-size:20px;font-weight:700}
.rpt-bar-wrap{background:var(--inp-bg);border-radius:10px;height:7px;overflow:hidden;margin-bottom:6px}
.rpt-bar{height:100%;border-radius:10px;transition:width .4s}
.rpt-meta{font-size:11px;color:var(--text2);display:flex;gap:10px}
.badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600}
.badge-ok{background:#d4edda;color:#155724}
.badge-warn{background:#fff3cd;color:#856404}
.badge-no{background:var(--border);color:var(--text2)}
.summary-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sum-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.sum-val{font-size:24px;font-weight:700;margin-bottom:2px}
.sum-lbl{font-size:11px;color:var(--text2)}
.empty-msg{text-align:center;padding:30px 0;color:var(--text2);font-size:13px}
/* 마감보고 */
.closing-section{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);border:1px solid var(--border)}
.closing-section h3{font-size:13px;font-weight:600;margin-bottom:10px;color:var(--primary);display:flex;align-items:center;gap:6px}
@media(prefers-color-scheme:dark){.closing-section h3{color:#f0f0f0}}
.closing-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.closing-label{font-size:12px;color:var(--text2);min-width:60px}
.closing-val{font-size:14px;font-weight:700;color:var(--accent)}
.closing-inp{flex:1;border:1px solid var(--border);border-radius:7px;padding:7px 9px;font-size:13px;font-family:inherit;background:var(--inp-bg);color:var(--text);outline:none}
.closing-ta{width:100%;border:1px solid var(--border);border-radius:7px;padding:8px;font-size:13px;font-family:inherit;color:var(--text);background:var(--inp-bg);outline:none;resize:none}
.achieve-bar-wrap{background:var(--inp-bg);border-radius:10px;height:8px;overflow:hidden;margin:6px 0}
.achieve-bar{height:100%;border-radius:10px;transition:width .4s}
.photo-upload-area{border:2px dashed var(--border);border-radius:10px;padding:20px;text-align:center;cursor:pointer;color:var(--text2);font-size:13px;margin-bottom:8px;transition:border-color .2s}
.photo-upload-area:hover{border-color:var(--accent2)}
.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.photo-thumb{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:1}
.photo-thumb img{width:100%;height:100%;object-fit:cover}
.photo-thumb-del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,0.6);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
/* 권한 배지 */
.perm-badge{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600;white-space:nowrap}
.perm-manager{background:#e8f4fd;color:#1a6fa8}
.perm-master{background:#f3e8fd;color:#6a1ab8}
@media(prefers-color-scheme:dark){.perm-manager{background:#1a3a50;color:#7ec8f5}.perm-master{background:#2e1a50;color:#c87ef5}}
/* 피드백 */
.feedback-card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;border:2px solid var(--accent2);box-shadow:var(--shadow)}
.feedback-header{font-size:13px;font-weight:600;color:var(--accent2);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.feedback-meta{font-size:11px;color:var(--text2);margin-top:8px}
/* 계정관리 */
.acct-card{background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--border);margin-bottom:8px;box-shadow:var(--shadow)}
.acct-item{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.acct-item:last-child{border-bottom:none}
.acct-info{flex:1}
.acct-id{font-size:13px;font-weight:600}
.acct-pw{font-size:11px;color:var(--text2);margin-top:1px}
.acct-type{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600}
.acct-staff{background:#e8f5e9;color:#2e7d32}
.acct-manager{background:#e8f4fd;color:#1a6fa8}
.acct-master{background:#f3e8fd;color:#6a1ab8}
@media(prefers-color-scheme:dark){.acct-staff{background:#1a3020}.acct-manager{background:#1a3a50}.acct-master{background:#2e1a50}}

/* TOAST */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:9px 20px;border-radius:20px;font-size:13px;z-index:9999;opacity:0;transition:opacity .25s;white-space:nowrap;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,0.2)}
.toast.show{opacity:1}

.confirm-btn-ok{flex:1;padding:11px;border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.confirm-btn-ok.danger{background:var(--danger)}
.confirm-btn-ok.primary{background:var(--accent2)}

// ── Firebase CRUD ──
async function fbGet(path){
  try{const snap=await get(ref(db,path));return snap.exists()?snap.val():null;}
  catch(e){console.warn('fbGet err',e);return null;}
}
async function fbSet(path,val){
  try{await set(ref(db,path),val);}
  catch(e){console.warn('fbSet err',e);throw e;}
}
function fbListen(path,cb){
  const r=ref(db,path);
  onValue(r,snap=>cb(snap.exists()?snap.val():null));
  return r;
}
function fbUnlisten(r){if(r)try{off(r);}catch{}}

function dayPath(sc,date){return `days/${sc}/${date.replace(/-/g,'')}`;}
function cfgPath(sc){return `configs/${sc}`;}
function staffPath(sc){return `staff/${sc}`;}

// ── 간부 경로 ──
function chiefPath(sc){ return 'chiefs/'+sc; }
async function getChiefs(sc){
  const d=await fbGet(chiefPath(sc));
  return d?Object.values(d).filter(Boolean):[];
}
async function setChiefs(sc,list){
  await fbSet(chiefPath(sc), list.length?Object.fromEntries(list.map((n,i)=>[i,n])):null);
}
// 현재 로그인 계정이 간부인지 확인
async function isChief(){
  if(isMaster())return true;
  if(!curStore)return false;
  const chiefs=await getChiefs(curStore.code);
  const staffList=await getStaff(curStore.code);
  // manager 계정은 항상 간부
  if(isManager())return true;
  return false;
}

// 매장 목록 Firebase 저장/로드
async function loadStores(){
  try{
    const data=await fbGet(storesPath());
    if(data&&Array.isArray(data)&&data.length>0){
      STORES=data;
    } else {
      // 최초 1회: 기본 매장 목록을 Firebase에 저장
      await fbSet(storesPath(), DEFAULT_STORES);
      STORES=[...DEFAULT_STORES];
    }
    rebuildActs();
  } catch(e){ console.warn('loadStores error',e); STORES=[...DEFAULT_STORES]; }
}
async function saveStores(list){
  await fbSet(storesPath(), list);
  STORES=list;
  rebuildActs();
}

async function getData(sc,date){
  const d=await fbGet(dayPath(sc,date));
  return d||{checks:{},facility:{},repairs:[],memo:{},submitted:false};
}
async function setData(sc,date,data){await fbSet(dayPath(sc,date),data);}
async function getConfig(sc){
  const c=await fbGet(cfgPath(sc));
  return c||{checklist:JSON.parse(JSON.stringify(DEF_CL))};
}
async function setConfig(sc,c){await fbSet(cfgPath(sc),c);}
async function getStaff(sc){const s=await fbGet(staffPath(sc));return s?Object.values(s):[];}
async function setStaff(sc,list){await fbSet(staffPath(sc),list.length?Object.fromEntries(list.map((n,i)=>[i,n])):null);}

function showOverlay(msg){document.getElementById('sync-msg').textContent=msg;document.getElementById('sync-overlay').classList.add('show');}
function hideOverlay(){document.getElementById('sync-overlay').classList.remove('show');}
function setSyncB(state,msg){const el=document.getElementById('sync-badge');if(!el)return;el.className='sync-badge '+state;el.textContent=msg;}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function todayStr(){return new Date().toISOString().slice(0,10);}
function curDate(){return document.getElementById('cur-date').value;}
function calcRate(cfg,data){const t=countTotal(cfg);if(!t)return 0;return Math.round(countDone(cfg,data)/t*100);}
function countTotal(cfg){return Object.values(cfg.checklist).reduce((s,items)=>s+items.length,0);}
function countDone(cfg,data){let d=0;for(const[sec,items]of Object.entries(cfg.checklist))items.forEach((_,i)=>{const v=(data.checks||{})[sec+':'+i];if(v==='done'||v==='na')d++;});return d;}
function toggleSec(h){const b=h.nextElementSibling;const a=h.querySelector('.sec-arr');b.classList.toggle('open');a.classList.toggle('open',b.classList.contains('open'));}

window.addEventListener('popstate',()=>{
  if(curStore&&document.getElementById('s-app').classList.contains('active')){
    goBack();
  } else if(document.getElementById('s-home').classList.contains('active')){
    doLogout();
  }
});

// ── 로그인 / 로그아웃 ──
document.getElementById('inp-pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
document.getElementById('inp-id').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('inp-pw').focus();});

async function doLogin(){
  const id=document.getElementById('inp-id').value.trim();
  const pw=document.getElementById('inp-pw').value;
  // 매장 목록 먼저 로드 (최신 반영)
  showOverlay('로그인 중...');
  await loadStores();
  await loadCustomPasswords();
  rebuildActs();
  hideOverlay();
  if(ACCTS[id]&&ACCTS[id]===pw){
    document.getElementById('login-err').style.display='none';
    curUser=id;
    history.pushState({},'',location.href);
    if(id==='admin'){curStore=null;showHome();}
    else{
      curStore=STORES.find(s=>s.code===id);
      if(!curStore){document.getElementById('login-err').style.display='block';return;}
      showApp();
    }
  } else {
    document.getElementById('login-err').style.display='block';
  }
}
function doLogout(){
  fbUnlisten(curListener);curListener=null;
  curUser=null;curStore=null;curTab=0;
  show('s-login');
  document.getElementById('inp-id').value='';
  document.getElementById('inp-pw').value='';
}

// ── HOME ──
function showHome(){show('s-home');switchHTab('stores');}
function switchHTab(t){
  homeTab=t;
  ['stores','staff','admin','stores-manage','accounts','closing-report','report'].forEach(x=>{const el=document.getElementById('ht-'+x);if(el)el.classList.toggle('active',x===t);});
  renderHomeBody();
}
async function renderHomeBody(){
  const body=document.getElementById('home-body');
  body.innerHTML='<div class="empty-msg">불러오는 중...</div>';
  if(homeTab==='stores')await renderStores(body);
  else if(homeTab==='staff')await renderStaffAll(body);
  else if(homeTab==='admin')await renderAdmin(body);
  else if(homeTab==='stores-manage')await renderStoresManage(body);
  else if(homeTab==='accounts')await renderAccountsMgmt(body);
  else if(homeTab==='closing-report')await renderClosingReport(body);
  else renderReport(body);
}

async function renderStores(body){
  const today=todayStr();
  let html=`<div style="font-size:12px;color:var(--text2);margin-bottom:10px">오늘(${today}) 매장 현황 · 실시간</div><div class="store-grid">`;
  for(const s of STORES){
    const data=await getData(s.code,today);
    const cfg=await getConfig(s.code);
    const rate=calcRate(cfg,data);
    html+=`<div class="store-tile" onclick="enterStore('${s.code}')">
      <div class="tile-type">${s.type}</div>
      <div class="tile-name">${s.name}</div>
      <div class="tile-code">${s.code}</div>
      <div class="tile-rate">${rate}%</div>
      ${data.submitted?'<div class="tile-sub">✓전체제출</div>':(data.submittedCheck||data.submittedFac||data.submittedRepair)?'<div class="tile-sub" style="color:var(--warn)">일부제출</div>':''}
    </div>`;
  }
  body.innerHTML=html+'</div>';
}

function enterStore(code){
  curStore=STORES.find(s=>s.code===code);
  history.pushState({},'',location.href);
  showApp();
}

async function renderStaffAll(body){
  showOverlay('직원 목록 불러오는 중...');
  // 모든 매장 직원 한번에 로드
  const allStaff = {};
  for(const s of STORES){ allStaff[s.code]=await getStaff(s.code); }
  hideOverlay();

  // 매장 선택 셀렉트
  const storeSel=`<div class="rpt-filter" style="margin-bottom:12px">
    <div class="rpt-filter-row" style="flex-wrap:nowrap">
      <label style="white-space:nowrap">매장 선택</label>
      <select id="staff-store-sel" onchange="setStaffViewStore(this.value)" style="flex:1;border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:13px;font-family:inherit;background:var(--inp-bg);color:var(--text);outline:none">
        <option value="ALL">전체 매장 보기</option>
        ${STORES.map(s=>`<option value="${s.code}"${s.code===staffViewStore?' selected':''}>${s.name} (${s.code})</option>`).join('')}
      </select>
    </div>
  </div>`;

  const targetStores = staffViewStore==='ALL' ? STORES : STORES.filter(s=>s.code===staffViewStore);
  // 간부 목록도 로드
  const allChiefs={};
  for(const s of targetStores){ allChiefs[s.code]=await getChiefs(s.code); }

  let html = storeSel;
  for(const s of targetStores){
    const list = allStaff[s.code]||[];
    const chiefs = allChiefs[s.code]||[];
    const itemsHtml = list.length
      ? list.map((n,i)=>{
          const isC=chiefs.includes(n);
          return `<div class="adm-item">
            <div class="adm-item-info">
              <div class="adm-item-name">${n}${isC?'<span class="perm-badge perm-manager" style="margin-left:6px">간부</span>':''}</div>
            </div>
            <div class="adm-btns">
              <button class="btn-edit-item" style="background:${isC?'#e8f4fd':'#f5f5f5'}" onclick="toggleChief('${s.code}','${n.replace(/'/g,"\\'")}',${isC})">${isC?'간부해제':'간부지정'}</button>
              <button class="btn-edit-item" onclick="admEditStaff('${s.code}',${i},'${n.replace(/'/g,"\\'")}')">수정</button>
              <button class="btn-del" onclick="admDelStaff('${s.code}',${i})">삭제</button>
            </div>
          </div>`;}).join('')
      : '<div class="adm-item"><span style="font-size:13px;color:var(--text2)">등록된 직원 없음</span></div>';

    html+=`<div class="adm-card" style="margin-bottom:10px">
      <div class="adm-collapse-hdr" onclick="toggleAdmCollapse(this)">
        <span class="adm-collapse-title">${s.name}</span>
        <span class="adm-collapse-cnt" style="margin-right:4px">${s.type}</span>
        <span class="adm-collapse-cnt">${list.length}명</span>
        <span class="adm-collapse-arr open">▼</span>
      </div>
      <div class="adm-collapse-body open">
        ${itemsHtml}
        <div class="add-row">
          <input type="text" id="ns-${s.code}" placeholder="${s.name} 직원 이름">
          <button class="btn-add" onclick="admAddStaff('${s.code}')">추가</button>
        </div>
      </div>
    </div>`;
  }
  body.innerHTML=html;
}

async function toggleChief(storeCode, name, isCurrentlyChief){
  const action=isCurrentlyChief?'간부 해제':'간부 지정';
  const ok=await showConfirm(action,'"'+name+'"을(를) '+action+'하시겠습니까?','primary','⭐');
  if(!ok)return;
  showOverlay('저장 중...');
  let chiefs=await getChiefs(storeCode);
  if(isCurrentlyChief){ chiefs=chiefs.filter(n=>n!==name); }
  else { if(!chiefs.includes(name))chiefs.push(name); }
  await setChiefs(storeCode,chiefs);
  hideOverlay();
  showToast('"'+name+'" '+action+' 완료');
  await renderStaffAll(document.getElementById('home-body'));
}

async function admDelStaff(storeCode,idx){
  const list=await getStaff(storeCode);
  const staffName=list[idx]||'이 직원';
  const storeName=STORES.find(s=>s.code===storeCode).name;
  const ok=await showConfirm('직원 삭제',storeName+'\n"'+staffName+'" 직원을 삭제하시겠습니까?','danger','👤');
  if(!ok)return;
  showOverlay('저장 중...');
  list.splice(idx,1);
  await setStaff(storeCode,list);hideOverlay();showToast('"'+staffName+'" 삭제 완료');
  await renderStaffAll(document.getElementById('home-body'));
}
async function admEditStaff(storeCode,idx,oldName){
  const newName=prompt('직원 이름 수정',oldName);
  if(!newName||newName.trim()===oldName)return;
  const ok=await showConfirm('직원 수정','"'+oldName+'" → "'+newName.trim()+'"\n으로 수정하시겠습니까?','primary','✏️');
  if(!ok)return;
  showOverlay('저장 중...');
  const list=await getStaff(storeCode);
  list[idx]=newName.trim();
  await setStaff(storeCode,list);hideOverlay();showToast('"'+newName.trim()+'" 으로 수정됐습니다');
  await renderStaffAll(document.getElementById('home-body'));
}
async function admAddStaff(storeCode){
  const inp=document.getElementById('ns-'+storeCode);
  const name=(inp?inp.value:'').trim();
  if(!name)return showToast('이름을 입력해주세요');
  showOverlay('저장 중...');
  const list=await getStaff(storeCode);
  if(list.includes(name)){hideOverlay();return showToast('이미 등록된 직원입니다');}
  list.push(name);await setStaff(storeCode,list);
  hideOverlay();showToast(name+' 등록 완료');
  await renderStaffAll(document.getElementById('home-body'));
}

// ── 드래그앤드롭 (마우스) ──
function onDragStart(e,sec,idx){
  dragSec=sec;dragIdx=idx;
  e.dataTransfer.effectAllowed='move';
  setTimeout(()=>e.target.classList.add('dragging'),0);
}
function onDragOver(e,idx){
  e.preventDefault();e.dataTransfer.dropEffect='move';
  dragOverIdx=idx;
  document.querySelectorAll('.adm-item').forEach(el=>el.classList.remove('drag-over'));
  e.currentTarget.classList.add('drag-over');
}
function onDragLeave(e){e.currentTarget.classList.remove('drag-over');}
async function onDrop(e,sec,toIdx){
  e.preventDefault();
  document.querySelectorAll('.adm-item').forEach(el=>{el.classList.remove('drag-over');el.classList.remove('dragging');});
  if(dragSec!==sec||dragIdx===toIdx||dragIdx===null)return;
  showOverlay('순서 저장 중...');
  const cfg=await getConfig(adminStore);
  const items=cfg.checklist[sec];
  const [moved]=items.splice(dragIdx,1);
  items.splice(toIdx,0,moved);
  await setConfig(adminStore,cfg);
  dragSec=null;dragIdx=null;dragOverIdx=null;
  hideOverlay();showToast('순서가 저장됐습니다');renderHomeBody();
}
function onDragEnd(e){
  e.target.classList.remove('dragging');
  document.querySelectorAll('.adm-item').forEach(el=>el.classList.remove('drag-over'));
}

// ── 터치 드래그 (모바일) ──
let touchSec=null,touchFromIdx=null,touchClone=null,touchScrollY=0;
function onTouchStart(e,sec,idx){
  if(e.target.className!=='drag-handle'&&!e.target.closest('.drag-handle'))return;
  touchSec=sec;touchFromIdx=idx;
  const el=e.currentTarget;
  const rect=el.getBoundingClientRect();
  touchClone=el.cloneNode(true);
  touchClone.style.cssText=`position:fixed;left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;opacity:.85;z-index:9999;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.2);border-radius:8px;background:var(--card)`;
  document.body.appendChild(touchClone);
  el.classList.add('dragging');
  touchScrollY=window.scrollY;
}
function onTouchMove(e){
  if(!touchClone)return;
  e.preventDefault();
  const t=e.touches[0];
  touchClone.style.top=(t.clientY-30)+'px';
  touchClone.style.left=(t.clientX-20)+'px';
  const under=document.elementFromPoint(t.clientX,t.clientY);
  const item=under?under.closest('.adm-item[data-idx]'):null;
  document.querySelectorAll('.adm-item').forEach(el=>el.classList.remove('drag-over'));
  if(item&&item.dataset.sec===touchSec)item.classList.add('drag-over');
}
async function onTouchEnd(e,sec,idx){
  if(!touchClone){touchSec=null;touchFromIdx=null;return;}
  const t=e.changedTouches[0];
  const under=document.elementFromPoint(t.clientX,t.clientY);
  const item=under?under.closest('.adm-item[data-idx]'):null;
  if(touchClone){touchClone.remove();touchClone=null;}
  document.querySelectorAll('.adm-item').forEach(el=>{el.classList.remove('dragging');el.classList.remove('drag-over');});
  const toIdx=item&&item.dataset.sec===touchSec?parseInt(item.dataset.idx):null;
  if(toIdx!==null&&toIdx!==touchFromIdx){
    showOverlay('순서 저장 중...');
    const cfg=await getConfig(adminStore);
    const items=cfg.checklist[touchSec];
    const [moved]=items.splice(touchFromIdx,1);
    items.splice(toIdx,0,moved);
    await setConfig(adminStore,cfg);
    hideOverlay();showToast('순서가 저장됐습니다');renderHomeBody();
  }
  touchSec=null;touchFromIdx=null;
}

function renderReport(body){
  body.innerHTML=`<div class="rpt-filter">
    <div class="rpt-filter-row">
      <label>날짜</label>
      <input type="date" id="rpt-date" value="${todayStr()}" onchange="loadReport()">
      <select id="rpt-store" onchange="loadReport()">
        <option value="all">전체 매장</option>
        ${STORES.map(s=>`<option value="${s.code}">${s.name}</option>`).join('')}
      </select>
    </div>
  </div>
  <div id="rpt-body"><div class="empty-msg">불러오는 중...</div></div>`;
  loadReport();
}
async function loadReport(){
  const dateEl=document.getElementById('rpt-date');
  const stEl=document.getElementById('rpt-store');
  if(!dateEl||!stEl)return;
  const date=dateEl.value;
  const sf=stEl.value;
  const body=document.getElementById('rpt-body');
  if(!date){body.innerHTML='<div class="empty-msg">날짜를 선택해주세요</div>';return;}
  body.innerHTML='<div class="empty-msg">불러오는 중...</div>';
  const targets=sf==='all'?STORES:STORES.filter(s=>s.code===sf);
  let totalDone=0,totalItems=0,subCnt=0,cards='';
  for(const s of targets){
    const data=await getData(s.code,date);
    const cfg=await getConfig(s.code);
    const total=countTotal(cfg);
    const done=countDone(cfg,data);
    const rate=total?Math.round(done/total*100):0;
    totalDone+=done;totalItems+=total;
    if(data.submitted)subCnt++;
    const bc=rate>=80?'#1D9E75':rate>=50?'#BA7517':'#A32D2D';
    const badge=data.submitted?'<span class="badge badge-ok">전체제출</span>':
      (data.submittedCheck||data.submittedFac||data.submittedRepair)?'<span class="badge badge-warn">일부제출</span>':
      rate>0?'<span class="badge badge-warn">진행중</span>':'<span class="badge badge-no">미시작</span>';
    const subDetail=`<span>${data.submittedCheck?'✓체크':'·체크'}</span><span>${data.submittedFac?'✓시설':'·시설'}</span><span>${data.submittedRepair?'✓보수':'·보수'}</span>`;
    cards+=`<div class="rpt-card">
      <div class="rpt-card-top">
        <div><div class="rpt-store">${s.name}</div><div style="font-size:11px;color:var(--text2)">${s.code} · ${s.type}</div></div>
        <div style="text-align:right"><div class="rpt-rate" style="color:${bc}">${rate}%</div>${badge}</div>
      </div>
      <div class="rpt-bar-wrap"><div class="rpt-bar" style="width:${rate}%;background:${bc}"></div></div>
      <div class="rpt-meta"><span>${done} / ${total} 완료</span>${subDetail}${data.submittedAt?`<span>${data.submittedAt.slice(11,16)} 완료</span>`:''}</div>
    </div>`;
  }
  const avg=totalItems?Math.round(totalDone/totalItems*100):0;
  const summary=`<div class="summary-cards">
    <div class="sum-card"><div class="sum-val" style="color:var(--accent)">${avg}%</div><div class="sum-lbl">평균 이행률</div></div>
    <div class="sum-card"><div class="sum-val" style="color:var(--ok)">${subCnt}<span style="font-size:16px;color:var(--text2)"> / ${targets.length}</span></div><div class="sum-lbl">제출 완료 매장</div></div>
  </div>`;
  body.innerHTML=summary+(cards||'<div class="empty-msg">해당 날짜에 데이터가 없습니다</div>');
}

// ── 탭별 제출 키 ──
function tabSubmitKey(){
  if(curTab===0)return 'submittedCheck';
  if(curTab===1)return 'submittedFac';
  if(curTab===2)return 'submittedRepair';
  if(curTab===3)return 'submittedClosing';
  return null;
}
function tabLabel(){
  if(curTab===0)return '체크시트';
  if(curTab===1)return '시설점검';
  if(curTab===2)return '보수요청';
  if(curTab===3)return '마감보고';
  return '';
}

// ── PROGRESS & SUBMIT ──
async function updateProgress(){
  const cfg=await getConfig(curStore.code);
  const data=await getData(curStore.code,curDate());
  const rate=calcRate(cfg,data);
  document.getElementById('prog-pill').textContent=rate+'%';
  updateSubmitBar(data);
}
function updateSubmitBar(data){
  const key=tabSubmitKey();
  const btnSubmit=document.getElementById('btn-submit');
  const btnUnlock=document.getElementById('btn-unlock');
  if(!btnSubmit)return;
  // 메모 탭은 제출 없음
  if(key===null){
    btnSubmit.style.display='none';
    btnUnlock.style.display='none';
    return;
  }
  btnSubmit.style.display='';
  if(data[key]){
    // 제출된 상태
    btnSubmit.textContent='✓ '+tabLabel()+' 제출완료';
    btnSubmit.style.background='#1D9E75';
    btnSubmit.disabled=true;
    btnUnlock.style.display='';
  } else {
    // 미제출 상태
    btnSubmit.textContent='✅ '+tabLabel()+' 제출';
    btnSubmit.style.background='';
    btnSubmit.disabled=false;
    btnUnlock.style.display='none';
  }
}
async function saveNow(){
  setSyncB('saving','저장 중...');
  if(curTab===3) await saveClosingData();
  else{ await new Promise(r=>setTimeout(r,200)); }
  setSyncB('saved','저장됨 ✓');
  showToast('저장되었습니다');
}
async function submitCurrent(){
  const key=tabSubmitKey();
  if(!key)return;
  const data=await getData(curStore.code,curDate());
  if(data[key]){showToast('이미 제출되었습니다. 수정 버튼을 눌러주세요');return;}
  const label=tabLabel();
  if(!confirm(`${curDate()} [${label}]을 제출하시겠습니까?\n제출 후 수정 버튼으로 다시 수정 가능합니다.`))return;
  showOverlay('제출 중...');
  data[key]=true;
  data[key+'At']=new Date().toISOString();
  // 3개 모두 제출됐으면 전체 제출 완료 표시
  if(data.submittedCheck&&data.submittedFac&&data.submittedRepair){
    data.submitted=true;data.submittedAt=new Date().toISOString();
  }
  await setData(curStore.code,curDate(),data);
  hideOverlay();
  showToast('['+label+'] 제출 완료!');
  updateSubmitBar(data);
}
async function unlockCurrent(){
  const key=tabSubmitKey();
  if(!key)return;
  const label=tabLabel();
  if(!confirm(`[${label}] 제출을 취소하고 수정하시겠습니까?`))return;
  showOverlay('수정 모드로 전환 중...');
  const data=await getData(curStore.code,curDate());
  data[key]=false;
  delete data[key+'At'];
  // 전체 제출 상태도 해제
  data.submitted=false;
  delete data.submittedAt;
  await setData(curStore.code,curDate(),data);
  hideOverlay();
  showToast('['+label+'] 수정 가능 상태로 변경됐습니다');
  updateSubmitBar(data);
}

async function admAddStore(){
  const code=(document.getElementById('new-store-code').value||'').trim().toUpperCase();
  const name=(document.getElementById('new-store-name').value||'').trim();
  const type=document.getElementById('new-store-type').value;
  if(!code) return showToast('매장코드를 입력해주세요');
  if(!name) return showToast('매장명을 입력해주세요');
  if(!/^[A-Z0-9]+$/.test(code)) return showToast('매장코드는 영문+숫자만 가능합니다 (예: M0018)');
  if(STORES.find(s=>s.code===code)) return showToast(code+' 코드는 이미 존재합니다');
  const ok=await showConfirm('매장 추가',
    '"'+name+'" ('+code+') 매장을 추가하시겠습니까?\n\n로그인 아이디: '+code+'\n초기 비밀번호: 1234',
    'primary','🏪');
  if(!ok) return;
  showOverlay('매장 추가 중...');
  const newList=[...STORES, {code, name, type}];
  await saveStores(newList);
  // 신규 매장은 기본 체크리스트로 초기화
  const existCfg=await fbGet(cfgPath(code));
  if(!existCfg) await setConfig(code,{checklist:JSON.parse(JSON.stringify(DEF_CL))});
  hideOverlay();
  showToast('"'+name+'" 매장이 추가됐습니다!');
  renderStoresManage(document.getElementById('home-body'));
}
async function admSaveStore(idx){
  const code=(document.getElementById('store-edit-code-'+idx).value||'').trim().toUpperCase();
  const name=(document.getElementById('store-edit-name-'+idx).value||'').trim();
  const type=document.getElementById('store-edit-type-'+idx).value;
  const oldStore=STORES[idx];
  if(!code||!name) return showToast('코드와 매장명을 모두 입력해주세요');
  if(!/^[A-Z0-9]+$/.test(code)) return showToast('매장코드는 영문+숫자만 가능합니다');
  if(code!==oldStore.code && STORES.find((s,i)=>s.code===code&&i!==idx))
    return showToast(code+' 코드는 이미 사용 중입니다');
  const ok=await showConfirm('매장 수정',
    '"'+oldStore.name+'" → "'+name+'"\n코드: '+oldStore.code+(code!==oldStore.code?' → '+code:'')+'\n유형: '+type+'\n\n수정하시겠습니까?',
    'primary','✏️');
  if(!ok) return;
  showOverlay('저장 중...');
  const newList=[...STORES];
  newList[idx]={code,name,type};
  await saveStores(newList);
  hideOverlay();
  showToast('"'+name+'" 매장 정보가 수정됐습니다');
  renderStoresManage(document.getElementById('home-body'));
}
async function admDelStore(idx){
  const s=STORES[idx];
  const ok=await showConfirm('매장 삭제',
    '"'+s.name+'" ('+s.code+') 매장을 삭제하시겠습니까?\n\n⚠️ 해당 매장의 체크리스트·직원 데이터는\n별도로 유지됩니다 (로그인만 불가)',
    'danger','🗑️');
  if(!ok) return;
  showOverlay('삭제 중...');
  const newList=STORES.filter((_,i)=>i!==idx);
  await saveStores(newList);
  hideOverlay();
  showToast('"'+s.name+'" 매장이 삭제됐습니다');
  renderStoresManage(document.getElementById('home-body'));
}

// ── 커스텀 확인 모달 ──
let confirmResolve = null;
function showConfirm(title, msg, type='danger', icon='⚠️'){
  return new Promise(resolve=>{
    confirmResolve = resolve;
    document.getElementById('confirm-title').textContent = title;
    document.getElementById('confirm-msg').textContent = msg;
    document.getElementById('confirm-icon').textContent = icon;
    const okBtn = document.getElementById('confirm-ok');
    okBtn.className = 'confirm-btn-ok ' + type;
    okBtn.textContent = type==='danger' ? '삭제' : '확인';
    document.getElementById('confirm-overlay').style.display = 'flex';
  });
}
window.confirmResolve = function(result){
  document.getElementById('confirm-overlay').style.display = 'none';
  if(confirmResolve){ confirmResolve(result); confirmResolve=null; }
};

async function admSaveSec(oldSec){
  const eid = oldSec.replace(/[^\w가-힣]/g,'_');
  const newSec = (document.getElementById('sec-edit-inp-'+eid).value||'').trim();
  if(!newSec) return showToast('분류명을 입력해주세요');
  if(newSec === oldSec){ hideSecEditRow(eid); return; }
  const ok = await showConfirm('대분류 수정', '"'+oldSec+'" → "'+newSec+'"\n으로 수정하시겠습니까?', 'primary', '✏️');
  if(!ok) return;
  showOverlay('저장 중...');
  const cfg = await getConfig(adminStore);
  const entries = Object.entries(cfg.checklist);
  const idx = entries.findIndex(([k])=>k===oldSec);
  if(idx===-1){ hideOverlay(); return showToast('항목을 찾을 수 없습니다'); }
  entries[idx][0] = newSec;
  cfg.checklist = Object.fromEntries(entries);
  await setConfig(adminStore, cfg);
  hideOverlay(); showToast('"'+newSec+'" 으로 수정됐습니다'); renderHomeBody();
}
async function admDelSec(sec){
  const cfg = await getConfig(adminStore);
  const cnt = (cfg.checklist[sec]||[]).length;
  const ok = await showConfirm('대분류 삭제', '"'+sec+'" 분류와\n하위 항목 '+cnt+'개를 모두 삭제하시겠습니까?\n\n이 작업은 되돌릴 수 없습니다.', 'danger', '🗑️');
  if(!ok) return;
  showOverlay('삭제 중...');
  delete cfg.checklist[sec];
  await setConfig(adminStore, cfg);
  hideOverlay(); showToast('"'+sec+'" 분류가 삭제됐습니다'); renderHomeBody();
}
async function admAddSec(){

        <button class="btn-edit-item" style="margin-left:8px" onclick="changePw('admin','master')">변경</button>
      </div>
      <div class="acct-card">${storeRows}</div>
    </div>`;
}

async function changePw(id, role){
  const newPw=prompt((role==='master'?'[마스터] ':role==='manager'?'[관리자] ':'[일반] ')+id+' 새 비밀번호 입력');
  if(!newPw||newPw.trim().length<4) return showToast('4자 이상 입력해주세요');
  const ok=await showConfirm('비밀번호 변경','"'+id+'" 비밀번호를 변경하시겠습니까?','primary','🔑');
  if(!ok)return;
  showOverlay('저장 중...');
  const key=id.replace('-','_');
  await fbSet('meta/passwords/'+key, newPw.trim());
  ACCTS[id]=newPw.trim();
  hideOverlay();
  showToast('"'+id+'" 비밀번호 변경 완료');
  renderAccountsMgmt(document.getElementById('home-body'));
}
async function addAdminStaff(){
  const name=(document.getElementById('new-admin-staff').value||'').trim();
  if(!name)return showToast('이름을 입력해주세요');
  const list=await getAdminStaff();
  if(list.includes(name))return showToast('이미 등록됨');
  list.push(name);
  await setAdminStaff(list);
  showToast(name+' 등록 완료');
  renderAccountsMgmt(document.getElementById('home-body'));
}
async function editAdminStaff(idx,oldName){
  const newName=prompt('이름 수정',oldName);
  if(!newName||newName.trim()===oldName)return;
  const list=await getAdminStaff();
  list[idx]=newName.trim();
  await setAdminStaff(list);
  showToast('수정 완료');
  renderAccountsMgmt(document.getElementById('home-body'));
}
async function delAdminStaff(idx){
  const list=await getAdminStaff();
  const ok=await showConfirm('삭제','"'+list[idx]+'"을 삭제하시겠습니까?','danger','🗑️');
  if(!ok)return;
  list.splice(idx,1);
  await setAdminStaff(list);
  showToast('삭제 완료');
  renderAccountsMgmt(document.getElementById('home-body'));
}

// ── 목표매출 엑셀 업로드 (SheetJS) ──
async function uploadTargetExcel(inp){
  const file=inp.files[0];
  if(!file)return;
  const resultEl=document.getElementById('excel-result');
  resultEl.textContent='처리 중...';
  try{
    const XLSX=window.XLSX;
    if(!XLSX){resultEl.textContent='❌ 엑셀 라이브러리 로딩 중... 잠시 후 재시도';return;}
    const ab=await file.arrayBuffer();
    const wb=XLSX.read(ab,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true});
    let cnt=0,errors=[];
    for(const row of rows){
      if(!row||row.length<3)continue;
      const storeCode=String(row[0]||'').trim().toUpperCase();
      const dateRaw=String(row[1]||'').trim().replace(/-/g,'');
      const amount=parseInt(String(row[2]||'').replace(/,/g,''));
      if(!storeCode.match(/^M\d+$/)||dateRaw.length!==8||isNaN(amount)){errors.push(storeCode+'/'+dateRaw);continue;}
      const path='targets/'+storeCode+'/'+dateRaw;
      await fbSet(path,amount);
      cnt++;
    }
    resultEl.style.color='var(--ok)';
    resultEl.textContent='✅ '+cnt+'건 저장 완료'+(errors.length?' / 오류: '+errors.slice(0,3).join(','):'');
  }catch(e){
    resultEl.style.color='var(--danger)';
    resultEl.textContent='❌ 오류: '+e.message;
  }
}

async function renderClosingReport(body){
  body.innerHTML=`<div class="rpt-filter">

      <label>날짜</label>
      <input type="date" id="cr-date" value="${todayStr()}" onchange="loadClosingReport()">
      <select id="cr-store" onchange="loadClosingReport()">
        <option value="all">전체 매장</option>
        ${STORES.map(s=>`<option value="${s.code}">${s.name}</option>`).join('')}
      </select>
    </div>
  </div>
  <div id="cr-body"><div class="empty-msg">불러오는 중...</div></div>`;
  await loadClosingReport();
}
async function loadClosingReport(){
  const dateEl=document.getElementById('cr-date');
  const stEl=document.getElementById('cr-store');
  if(!dateEl||!stEl)return;
  const date=dateEl.value;
  const sf=stEl.value;
  const body=document.getElementById('cr-body');
  if(!date){body.innerHTML='<div class="empty-msg">날짜를 선택해주세요</div>';return;}
  body.innerHTML='<div class="empty-msg">불러오는 중...</div>';
  const targets=sf==='all'?STORES:STORES.filter(s=>s.code===sf);
  let html='';
  for(const s of targets){
    const cl=await getClosing(s.code,date);
    const fb=await getFeedback(s.code,date);
    const target=await getTarget(s.code,date.replace(/-/g,''));
    const salesVal=cl.sales?parseInt(cl.sales):0;
    const targetVal=target?parseInt(target):0;
    const achievePct=targetVal>0?Math.min(Math.round(salesVal/targetVal*100),999):0;
    const achieveColor=achievePct>=100?'#1D9E75':achievePct>=80?'#BA7517':'#A32D2D';
    const submitted=cl.submitted||false;
    const hasData=cl.sales||cl.attend||cl.special||cl.stock;
    if(!hasData&&sf==='all')continue;
    html+=`<div class="rpt-card" style="margin-bottom:10px">
      <div class="rpt-card-top">
        <div>
          <div class="rpt-store">${s.name}</div>
          <div style="font-size:11px;color:var(--text2)">${s.code} · ${cl.reporter||'보고자 미선택'}</div>
        </div>
        <div style="text-align:right">
          ${submitted?'<span class="badge badge-ok">제출완료</span>':'<span class="badge badge-no">미제출</span>'}
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;margin-bottom:8px">
        <div style="background:var(--inp-bg);border-radius:6px;padding:6px 8px">
          <div style="color:var(--text2);margin-bottom:2px">목표매출</div>
          <div style="font-weight:600">${targetVal>0?targetVal.toLocaleString()+'원':'미설정'}</div>
        </div>
        <div style="background:var(--inp-bg);border-radius:6px;padding:6px 8px">
          <div style="color:var(--text2);margin-bottom:2px">금일매출 <span style="color:${achieveColor};font-weight:700">${achievePct}%</span></div>
          <div style="font-weight:600">${salesVal>0?salesVal.toLocaleString()+'원':'미입력'}</div>
        </div>
        ${cl.attend?`<div style="background:var(--inp-bg);border-radius:6px;padding:6px 8px;grid-column:1/-1"><div style="color:var(--text2);margin-bottom:2px">근태</div><div>${cl.attend}</div></div>`:''}
        ${cl.stock?`<div style="background:var(--inp-bg);border-radius:6px;padding:6px 8px"><div style="color:var(--text2);margin-bottom:2px">익일입하</div><div style="font-weight:600">${cl.stock} PCS</div></div>`:''}
        ${cl.special?`<div style="background:var(--inp-bg);border-radius:6px;padding:6px 8px;grid-column:1/-1"><div style="color:var(--text2);margin-bottom:2px">특이사항</div><div>${cl.special}</div></div>`:''}
      </div>
      ${cl.photos&&cl.photos.length?`<div class="photo-grid" style="grid-template-columns:repeat(3,1fr)">${cl.photos.map(p=>`<div class="photo-thumb"><img src="${p}"></div>`).join('')}</div>`:''}
      ${fb?`<div style="border-top:1px solid var(--border);margin-top:8px;padding-top:8px">
        <div style="font-size:11px;font-weight:600;color:var(--accent2);margin-bottom:4px">💬 피드백: ${fb.writer||''}</div>
        <div style="font-size:12px">${fb.content||''}</div>
        ${fb.photos&&fb.photos.length?`<div class="photo-grid" style="margin-top:6px;grid-template-columns:repeat(3,1fr)">${fb.photos.map(p=>`<div class="photo-thumb"><img src="${p}"></div>`).join('')}</div>`:''}
      </div>`:''}
      <button class="btn-edit-item" style="width:100%;margin-top:8px;padding:8px" onclick="enterStore('${s.code}')">매장 체크리스트 보기</button>
    </div>`;
  }
  body.innerHTML=body.innerHTML.replace('<div class="empty-msg">불러오는 중...</div>','');
  document.getElementById('cr-body').innerHTML=html||(sf==='all'?'<div class="empty-msg">오늘 제출된 마감보고가 없습니다</div>':'<div class="empty-msg">해당 날짜 마감보고 없음</div>');
}
